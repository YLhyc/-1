<!DOCTYPE html>
<html lang="zh-CN" data-theme="warm">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>706 繁体识记</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="706繁體" />
  <meta name="theme-color" content="#faf9f5" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --font-serif: Georgia, "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

      /* Palette B: Warm Parchment */
      --background: #faf9f5;
      --surface: #f3f1ea;
      --surface-elevated: #ffffff;
      --surface-hover: #ebe7dc;
      --text: #141413;
      --text-secondary: #5c5a53;
      --text-tertiary: #8c887e;
      --border: #e4e1d6;
      --border-strong: #cfcab8;

      --accent: #d97757;
      --success: #2f7d4a;
      --success-bg: #ebf5ee;
      --warning: #c46b16;
      --warning-bg: #fdf3e7;
      --error: #c93b2b;
      --error-bg: #fbeceb;
    }

    [data-mode="dark"] {
      --background: #141413;
      --surface: #1c1b19;
      --surface-elevated: #22211e;
      --surface-hover: #2a2824;
      --text: #ece9e0;
      --text-secondary: #a6a298;
      --text-tertiary: #737067;
      --border: #2b2a26;
      --border-strong: #3f3d37;

      --accent: #e08a6d;
      --success: #4ade80;
      --success-bg: rgba(74, 222, 128, 0.12);
      --warning: #fbbf24;
      --warning-bg: rgba(251, 191, 36, 0.12);
      --error: #f87171;
      --error-bg: rgba(248, 113, 113, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--background);
      color: var(--text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    :focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 2px;
      border-radius: 4px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* Shell */
    .app-shell {
      width: 100%;
      max-width: 520px;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: calc(12px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom));
      gap: 10px;
    }

    /* Header */
    .top-bar {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title {
      font-family: var(--font-serif);
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.01em;
    }

    .deck-badge {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      background: var(--surface);
      border: 0.5px solid var(--border);
      padding: 3px 9px;
      border-radius: 999px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 0.5px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .icon-btn:hover {
      background: var(--surface-hover);
      color: var(--text);
    }

    /* Filter Tabs */
    .deck-tabs {
      flex: none;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }

    .deck-tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      flex: none;
      height: 30px;
      padding: 0 11px;
      border-radius: 8px;
      border: 0.5px solid var(--border);
      background: var(--background);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .tab-btn:hover {
      background: var(--surface);
      color: var(--text);
    }

    .tab-btn.active {
      background: var(--text);
      color: var(--background);
      border-color: var(--text);
    }

    .tab-count {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 11px;
      opacity: 0.78;
    }

    /* Progress Bar */
    .progress-track {
      flex: none;
      width: 100%;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.25s ease;
    }

    /* Stage */
    .stage {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1000px;
    }

    .flashcard {
      position: absolute;
      width: 100%;
      height: 100%;
      max-height: 460px;
      background: var(--surface-elevated);
      border: 0.5px solid var(--border-strong);
      border-radius: 14px;
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: grab;
      touch-action: none;
      will-change: transform;
      user-select: none;
      overflow: hidden;
    }

    .flashcard:active {
      cursor: grabbing;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .meta-tag {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      background: var(--surface);
      border: 0.5px solid var(--border);
      padding: 3px 10px;
      border-radius: 6px;
    }

    .meta-tag.requeue {
      color: var(--warning);
      background: var(--warning-bg);
      border-color: transparent;
    }

    .swipe-hint {
      position: absolute;
      top: 20px;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      border: 0.5px solid currentColor;
    }

    .swipe-hint.know { right: 20px; color: var(--success); background: var(--success-bg); }
    .swipe-hint.unknown { left: 20px; color: var(--error); background: var(--error-bg); }
    .swipe-hint.vague { top: 56px; left: 50%; transform: translateX(-50%); color: var(--warning); background: var(--warning-bg); }

    /* Center Glyph */
    .glyph-zone {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px 0;
    }

    .trad-glyph {
      font-family: var(--font-serif);
      font-size: 84px;
      font-weight: 600;
      line-height: 1.1;
      color: var(--text);
      letter-spacing: 0.04em;
    }

    .tap-prompt {
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-tertiary);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* Answer Reveal Box */
    .answer-box {
      border-top: 0.5px solid var(--border);
      padding-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .answer-box.concealed {
      filter: blur(8px);
      opacity: 0.22;
      pointer-events: none;
    }

    .ans-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }

    .simp-word {
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
    }

    .fam-words {
      font-family: var(--font-serif);
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
    }

    .ans-tip {
      font-family: var(--font-serif);
      font-size: 14px;
      line-height: 1.65;
      color: var(--text-secondary);
      max-width: 65ch;
    }

    /* Controls */
    .tool-row {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .secondary-btn {
      height: 32px;
      padding: 0 12px;
      border-radius: 8px;
      border: 0.5px solid var(--border-strong);
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .secondary-btn:hover {
      background: var(--surface-hover);
      color: var(--text);
    }

    .stats-inline {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot-stat {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    /* Rating Buttons */
    .rating-bar {
      flex: none;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .rate-btn {
      height: 48px;
      border-radius: 10px;
      border: 0.5px solid var(--border-strong);
      background: var(--surface-elevated);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: background 0.12s ease, transform 0.1s ease;
    }

    .rate-btn:active {
      transform: scale(0.98);
    }

    .rate-btn .label {
      font-size: 13px;
      font-weight: 600;
    }

    .rate-btn .sub {
      font-family: var(--font-mono);
      font-size: 11px;
      opacity: 0.72;
    }

    .rate-btn.unknown { color: var(--error); border-color: var(--error); background: var(--error-bg); }
    .rate-btn.vague { color: var(--warning); border-color: var(--warning); background: var(--warning-bg); }
    .rate-btn.know { color: var(--success); border-color: var(--success); background: var(--success-bg); }

    /* Summary Card */
    .summary-card {
      width: 100%;
      background: var(--surface-elevated);
      border: 0.5px solid var(--border-strong);
      border-radius: 14px;
      padding: 26px 22px;
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
    }

    .summary-title {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 700;
    }

    .summary-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .summary-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat-box {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 10px;
      padding: 12px 6px;
    }

    .stat-num {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 20px;
      font-weight: 600;
    }

    .stat-lbl {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 3px;
    }

    .primary-btn {
      width: 100%;
      height: 40px;
      border-radius: 8px;
      border: 0.5px solid var(--text);
      background: var(--text);
      color: var(--background);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="brand">
        <span class="brand-title">706 繁体识记</span>
        <span class="deck-badge" id="progressBadge">1 / 61</span>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="shuffleBtn" title="打乱顺序">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 3 21 3 21 8"></polyline>
            <line x1="4" y1="20" x2="21" y2="3"></line>
            <polyline points="21 16 21 21 16 21"></polyline>
            <line x1="15" y1="15" x2="21" y2="21"></line>
            <line x1="4" y1="4" x2="9" y2="9"></line>
          </svg>
        </button>
        <button class="icon-btn" id="themeBtn" title="切换日夜模式">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        </button>
        <button class="icon-btn" id="resetBtn" title="重置本组进度">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
          </svg>
        </button>
      </div>
    </header>

    <nav class="deck-tabs" id="deckTabs"></nav>

    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <main class="stage" id="stage">
      <div class="flashcard" id="flashcard">
        <div class="swipe-hint unknown" id="hintUnknown">不认识 · 重排</div>
        <div class="swipe-hint vague" id="hintVague">模糊 · 再看</div>
        <div class="swipe-hint know" id="hintKnow">熟知 · 过关</div>

        <div class="card-meta">
          <span class="meta-tag" id="cardGroup">今日 61 盲区</span>
          <span class="meta-tag requeue" id="requeueTag" style="display:none;">错字回炉</span>
        </div>

        <div class="glyph-zone" id="glyphZone">
          <div class="trad-glyph" id="tradGlyph">嚴</div>
          <div class="tap-prompt" id="tapPrompt">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            点击卡片或按空格显示简体与记忆法
          </div>
        </div>

        <div class="answer-box concealed" id="answerBox">
          <div class="ans-row">
            <span class="simp-word" id="simpWord">严</span>
            <span class="fam-words" id="famWords">嚴肅 / 威嚴</span>
          </div>
          <p class="ans-tip" id="ansTip">上两“口”戴帽，下“厂”里藏“敢”，与“敢”完全不同。</p>
        </div>
      </div>

      <div class="summary-card" id="summaryCard">
        <div class="summary-title">本组识记已清仓</div>
        <p class="summary-desc" id="summaryDesc">所有卡壳与模糊字均已通过回炉重测。</p>
        <div class="summary-grid">
          <div class="stat-box">
            <div class="stat-num" style="color:var(--success);" id="sumKnow">0</div>
            <div class="stat-lbl">一次熟知</div>
          </div>
          <div class="stat-box">
            <div class="stat-num" style="color:var(--warning);" id="sumVague">0</div>
            <div class="stat-lbl">模糊回炉</div>
          </div>
          <div class="stat-box">
            <div class="stat-num" style="color:var(--error);" id="sumUnknown">0</div>
            <div class="stat-lbl">不认识重排</div>
          </div>
        </div>
        <button class="primary-btn" id="restartBtn">重新刷一遍本组</button>
      </div>
    </main>

    <div class="tool-row" id="toolRow">
      <button class="secondary-btn" id="toggleRevealBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
          <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
          <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
          <line x1="2" y1="2" x2="22" y2="22"></line>
        </svg>
        <span id="revealLabel">显示答案 (Space)</span>
      </button>
      <div class="stats-inline">
        <span class="dot-stat"><span class="dot" style="background:var(--success);"></span><span id="liveKnow">0</span></span>
        <span class="dot-stat"><span class="dot" style="background:var(--warning);"></span><span id="liveVague">0</span></span>
        <span class="dot-stat"><span class="dot" style="background:var(--error);"></span><span id="liveUnknown">0</span></span>
      </div>
    </div>

    <footer class="rating-bar" id="ratingBar">
      <button class="rate-btn unknown" data-rate="unknown">
        <span class="label">不认识</span>
        <span class="sub">左滑 / 1</span>
      </button>
      <button class="rate-btn vague" data-rate="vague">
        <span class="label">模糊</span>
        <span class="sub">上滑 / 2</span>
      </button>
      <button class="rate-btn know" data-rate="know">
        <span class="label">熟知</span>
        <span class="sub">右滑 / 3</span>
      </button>
    </footer>
  </div>

      { id: "p31", deck: "prev", tag: "前期盲区 · 盲测", trad: "懼", simp: "惧", words: "畏懼", tip: "忄+瞿（两目睁大），惊恐畏惧。" },
      { id: "p32", deck: "prev", tag: "前期盲区 · 盲测", trad: "憂", simp: "忧", words: "憂患", tip: "頁（头）+ 心 + 夊，愁眉低头。" },
      { id: "p33", deck: "prev", tag: "前期盲区 · 盲测", trad: "恥", simp: "耻", words: "羞恥", tip: "耳 + 心，内心羞愧耳根发红。" },
      { id: "p34", deck: "prev", tag: "前期盲区 · 盲测", trad: "憐", simp: "怜", words: "哀憐", tip: "忄+ 粦，怜悯。" },
      { id: "p35", deck: "prev", tag: "前期盲区 · 盲测", trad: "顯", simp: "显", words: "顯赫", tip: "右“頁”，明显显赫。" },
      { id: "p36", deck: "prev", tag: "前期盲区 · 盲测", trad: "雙 / 隻", simp: "双 / 只", words: "雙璧 / 隻身", tip: "下皆为“又”（手）：手抓两鸟（隹隹）=雙；抓一鸟=隻。" },
      { id: "p37", deck: "prev", tag: "前期盲区 · 盲测", trad: "靈", simp: "灵", words: "神靈", tip: "雨 + 三口 + 巫，神灵灵验。" },
      { id: "p38", deck: "prev", tag: "前期盲区 · 盲测", trad: "徵", simp: "征", words: "徵召 / 徵驗", tip: "征召、证验、五声之徵作“徵”；征伐作“征”。" },
      { id: "p39", deck: "prev", tag: "前期盲区 · 盲测", trad: "嘗", simp: "尝", words: "未嘗", tip: "尚 + 旨，品尝，文言副词“曾经”。" },
      { id: "p40", deck: "prev", tag: "前期盲区 · 盲测", trad: "爾", simp: "尔", words: "爾輩 / 莞爾", tip: "第二人称“你”或词尾“……的样子”。" },
      { id: "p41", deck: "prev", tag: "前期盲区 · 盲测", trad: "網", simp: "网", words: "羅網", tip: "糹+ 罔，渔网罗网。" }
    ];

    const DECK_TABS = [
      { id: "today61", label: "今日 61 盲区" },
      { id: "multi", label: "一简多繁高危" },
      { id: "prev", label: "前期高频盲区" },
      { id: "all", label: "全部词库" }
    ];

    const STORAGE_KEY = "kaoyan706_trad_cards_v1";
    let saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{"known":{},"dark":false}');
    if (saved.dark) document.documentElement.setAttribute("data-mode", "dark");

    let currentDeckId = "today61";
    let queue = [];
    let totalInitial = 0;
    let sessionStats = { know: 0, vague: 0, unknown: 0 };
    let isRevealed = false;

    const flashcard = document.getElementById("flashcard");
    const summaryCard = document.getElementById("summaryCard");
    const answerBox = document.getElementById("answerBox");
    const tapPrompt = document.getElementById("tapPrompt");
    const revealLabel = document.getElementById("revealLabel");
    const toolRow = document.getElementById("toolRow");
    const ratingBar = document.getElementById("ratingBar");

    const hintUnknown = document.getElementById("hintUnknown");
    const hintVague = document.getElementById("hintVague");
    const hintKnow = document.getElementById("hintKnow");

    function getDeckItems(deckId) {
      return deckId === "all" ? DECK_DATA : DECK_DATA.filter(item => item.deck === deckId);
    }

    function renderTabs() {
      const wrap = document.getElementById("deckTabs");
      wrap.innerHTML = "";
      DECK_TABS.forEach(tab => {
        const items = getDeckItems(tab.id);
        const btn = document.createElement("button");
        btn.className = "tab-btn" + (tab.id === currentDeckId ? " active" : "");
        btn.innerHTML = `${tab.label} <span class="tab-count">${items.length}</span>`;
        btn.addEventListener("click", () => {
          currentDeckId = tab.id;
          initDeck();
        });
        wrap.appendChild(btn);
      });
    }

    function initDeck(shuffle = false) {
      let items = getDeckItems(currentDeckId).map(item => ({ ...item, requeued: false }));
      if (shuffle) {
        for (let i = items.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [items[i], items[j]] = [items[j], items[i]];
        }
      }
      queue = items;
      totalInitial = items.length;
      sessionStats = { know: 0, vague: 0, unknown: 0 };
      renderTabs();
      renderCard();
    }

    function setReveal(state) {
      isRevealed = state;
      answerBox.classList.toggle("concealed", !state);
      tapPrompt.style.visibility = state ? "hidden" : "visible";
      revealLabel.textContent = state ? "隐藏答案 (Space)" : "显示答案 (Space)";
    }

    function renderCard() {
      if (queue.length === 0) {
        flashcard.style.display = "none";
        toolRow.style.display = "none";
        ratingBar.style.display = "none";
        summaryCard.style.display = "flex";
        document.getElementById("sumKnow").textContent = sessionStats.know;
        document.getElementById("sumVague").textContent = sessionStats.vague;
        document.getElementById("sumUnknown").textContent = sessionStats.unknown;
        document.getElementById("progressBadge").textContent = `${totalInitial} / ${totalInitial}`;
        document.getElementById("progressFill").style.width = "100%";
        return;
      }

      const item = queue[0];
      flashcard.style.display = "flex";
      toolRow.style.display = "flex";
      ratingBar.style.display = "grid";
      summaryCard.style.display = "none";

      document.getElementById("cardGroup").textContent = item.tag;
      document.getElementById("requeueTag").style.display = item.requeued ? "inline-flex" : "none";
      document.getElementById("tradGlyph").textContent = item.trad;
      document.getElementById("simpWord").textContent = item.simp;
      document.getElementById("famWords").textContent = item.words;
      document.getElementById("ansTip").textContent = item.tip;

      const doneCount = Math.max(0, totalInitial - queue.length);
      document.getElementById("progressBadge").textContent = `剩 ${queue.length} / ${totalInitial}`;
      document.getElementById("progressFill").style.width = `${Math.min(100, (doneCount / totalInitial) * 100)}%`;

      document.getElementById("liveKnow").textContent = sessionStats.know;
      document.getElementById("liveVague").textContent = sessionStats.vague;
      document.getElementById("liveUnknown").textContent = sessionStats.unknown;

      setReveal(false);
      setTransform(0, 0);
      resetHints();
    }

    function resetHints() {
      hintKnow.style.opacity = 0;
      hintVague.style.opacity = 0;
      hintUnknown.style.opacity = 0;
    }

    let animFrame = null;
    function setTransform(x, y) {
      const rot = (x / 24).toFixed(2);
      flashcard.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0) rotate(${rot}deg)`;
    }

    function springTo(tx, ty, onDone) {
      if (animFrame) cancelAnimationFrame(animFrame);
      const style = window.getComputedStyle(flashcard);
      const matrix = new DOMMatrixReadOnly(style.transform);
      let cx = matrix.m41 || 0;
      let cy = matrix.m42 || 0;
      let vx = 0, vy = 0;
      let last = performance.now();

      function tick(now) {
        const dt = Math.min(32, Math.max(1, now - last)) / 1000;
        last = now;
        const ax = (tx - cx) * 520 - vx * 38;
        const ay = (ty - cy) * 520 - vy * 38;
        vx += ax * dt;
        vy += ay * dt;
        cx += vx * dt;
        cy += vy * dt;
        setTransform(cx, cy);

        if (Math.abs(tx - cx) < 0.8 && Math.abs(vx) < 8 && Math.abs(ty - cy) < 0.8 && Math.abs(vy) < 8) {
          setTransform(tx, ty);
          if (onDone) onDone();
          return;
        }
        animFrame = requestAnimationFrame(tick);
      }
      animFrame = requestAnimationFrame(tick);
    }

    function rateCard(type) {
      if (queue.length === 0) return;
      const current = queue.shift();
      sessionStats[type]++;

      // Words-style spaced re-queueing inside session
      if (type === "unknown") {
        current.requeued = true;
        const insertAt = Math.min(queue.length, 3);
        queue.splice(insertAt, 0, current);
      } else if (type === "vague") {
        current.requeued = true;
        const insertAt = Math.min(queue.length, 7);
        queue.splice(insertAt, 0, current);
      } else {
        saved.known[current.id] = true;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
      }

      const tx = type === "know" ? window.innerWidth + 120 : (type === "unknown" ? -window.innerWidth - 120 : 0);
      const ty = type === "vague" ? -window.innerHeight : 0;

      springTo(tx, ty, renderCard);
    }

    // Drag & Click Logic
    let dragging = false, moved = false;
    let sx = 0, sy = 0, dx = 0, dy = 0;

    function pointerDown(e) {
      if (queue.length === 0) return;
      if (animFrame) cancelAnimationFrame(animFrame);
      dragging = true;
      moved = false;
      sx = e.clientX ?? e.touches[0].clientX;
      sy = e.clientY ?? e.touches[0].clientY;
      dx = 0; dy = 0;
    }

    function pointerMove(e) {
      if (!dragging) return;
      const cx = e.clientX ?? e.touches[0].clientX;
      const cy = e.clientY ?? e.touches[0].clientY;
      dx = cx - sx;
      dy = cy - sy;
      if (Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
      setTransform(dx, dy);

      hintKnow.style.opacity = dx > 35 ? Math.min(1, (dx - 35) / 75) : 0;
      hintUnknown.style.opacity = dx < -35 ? Math.min(1, (-dx - 35) / 75) : 0;
      hintVague.style.opacity = (dy < -45 && Math.abs(dx) < 80) ? Math.min(1, (-dy - 45) / 75) : 0;
    }

    function pointerUp() {
      if (!dragging) return;
      dragging = false;
      resetHints();

      if (!moved) {
        setReveal(!isRevealed);
        return;
      }

      if (dx > 105) {
        rateCard("know");
      } else if (dx < -105) {
        rateCard("unknown");
      } else if (dy < -110) {
        rateCard("vague");
      } else {
        springTo(0, 0);
      }
    }

    flashcard.addEventListener("mousedown", pointerDown);
    window.addEventListener("mousemove", pointerMove);
    window.addEventListener("mouseup", pointerUp);
    flashcard.addEventListener("touchstart", pointerDown, { passive: true });
    window.addEventListener("touchmove", pointerMove, { passive: true });
    window.addEventListener("touchend", pointerUp);

    // Controls
    document.querySelectorAll(".rate-btn").forEach(btn => {
      btn.addEventListener("click", () => rateCard(btn.dataset.rate));
    });

    document.getElementById("toggleRevealBtn").addEventListener("click", () => setReveal(!isRevealed));
    document.getElementById("shuffleBtn").addEventListener("click", () => initDeck(true));
    document.getElementById("resetBtn").addEventListener("click", () => initDeck(false));
    document.getElementById("restartBtn").addEventListener("click", () => initDeck(false));

    document.getElementById("themeBtn").addEventListener("click", () => {
      const isDark = document.documentElement.getAttribute("data-mode") === "dark";
      if (isDark) {
        document.documentElement.removeAttribute("data-mode");
        saved.dark = false;
      } else {
        document.documentElement.setAttribute("data-mode", "dark");
        saved.dark = true;
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
    });

    window.addEventListener("keydown", e => {
      if (queue.length === 0) return;
      if (e.key === " ") {
        e.preventDefault();
        setReveal(!isRevealed);
      } else if (e.key === "1" || e.key === "ArrowLeft") {
        rateCard("unknown");
      } else if (e.key === "2" || e.key === "ArrowUp") {
        rateCard("vague");
      } else if (e.key === "3" || e.key === "ArrowRight") {
        rateCard("know");
      }
    });

    initDeck(false);
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
