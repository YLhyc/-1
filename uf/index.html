// ── Migrate uf_prefs from index-based to word-based keys (run once) ──
(function migrateUf() {
  var oldP, oldC;
  try { oldP = JSON.parse(localStorage.getItem('uf_prefs')||'{}'); } catch(e) { oldP = {}; }
  try { oldC = JSON.parse(localStorage.getItem('uf_counts')||'{}'); } catch(e) { oldC = {}; }
  var newP = {}, newC = {}, needsP = false, needsC = false;

  // Detect if migration needed
  for (var k in oldP) { if (/^(vocab|hb)_[0-9]+$/.test(k)) { needsP = true; break; } }
  for (var k in oldC) { if (/^(vocab|hb)_[0-9]+$/.test(k)) { needsC = true; break; } }

  // Backup before migrating
  if (needsP) localStorage.setItem('uf_prefs_backup', JSON.stringify(oldP));
  if (needsC) localStorage.setItem('uf_counts_backup', JSON.stringify(oldC));

  if (needsP) {
    for (var k in oldP) {
      var m = k.match(/^(vocab|hb)_([0-9]+)$/);
      if (m) {
        var arr = m[1] === 'vocab' ? VOCAB : HONGBAOSHU;
        var idx = parseInt(m[2]);
        if (idx < arr.length) newP[m[1] + '_' + arr[idx].en] = oldP[k];
      } else { newP[k] = oldP[k]; }
    }
    localStorage.setItem('uf_prefs', JSON.stringify(newP));
  }
  if (needsC) {
    for (var k in oldC) {
      var m = k.match(/^(vocab|hb)_([0-9]+)$/);
      if (m) {
        var arr = m[1] === 'vocab' ? VOCAB : HONGBAOSHU;
        var idx = parseInt(m[2]);
        if (idx < arr.length) newC[m[1] + '_' + arr[idx].en] = oldC[k];
      } else { newC[k] = oldC[k]; }
    }
    localStorage.setItem('uf_counts', JSON.stringify(newC));
  }
})();

// ── Build word list from sources (word-based keys) ──
function buildUFWords() {
  var words = [];
  var vvP; try { vvP = JSON.parse(localStorage.getItem('vv_prefs')||'{}'); } catch(e) { vvP = {}; }
  var hbP; try { hbP = JSON.parse(localStorage.getItem('hb_prefs')||'{}'); } catch(e) { hbP = {}; }
  // Scan vocab — iterate words, check by en
  for (var i = 0; i < VOCAB.length; i++) {
    if (vvP[VOCAB[i].en] === 'hard') {
      words.push({key:'vocab_'+VOCAB[i].en, en:VOCAB[i].en, cn:VOCAB[i].cn, source:'vocab', srcIdx:i});
    }
  }
  // Scan hongbaoshu
  for (var i = 0; i < HONGBAOSHU.length; i++) {
    if (hbP[HONGBAOSHU[i].en] === 'hard') {
      words.push({key:'hb_'+HONGBAOSHU[i].en, en:HONGBAOSHU[i].en, cn:HONGBAOSHU[i].cn, source:'hongbaoshu', srcIdx:i});
    }
  }
  return words;
}

function allWords() { return buildUFWords(); }
function wordsInUnit(u) {
  var all = allWords();
  var start = u * UNIT_SIZE;
  return all.slice(start, Math.min(start + UNIT_SIZE, all.length));
}
function wordsInGroup(g) {
  var ws = wordsInUnit(curUnit);
  var start = g * GROUP_SIZE;
  return ws.slice(start, Math.min(start + GROUP_SIZE, ws.length));
}
function totalUnits() { return Math.max(1, Math.ceil(allWords().length / UNIT_SIZE)); }

// ── Unit list ──
function renderUnits() {
  var all = allWords();
  var showRemoved = $('showRemovedToggle').checked;
  var up = ufPrefs();
  var total = Math.max(1, Math.ceil(all.length / UNIT_SIZE));
  var h = '';

  if (all.length === 0) {
    $('unitGrid').innerHTML = '';
    $('emptyUnits').style.display = 'block';
    updateTrashBadge();
    return;
  }
  $('emptyUnits').style.display = 'none';

  for (var u = 0; u < total; u++) {
    var ws = all.slice(u * UNIT_SIZE, Math.min((u+1) * UNIT_SIZE, all.length));
    var veryHard = 0, totalMarked = 0;
    for (var w = 0; w < ws.length; w++) {
      var pref = up[ws[w].key];
      if (pref === 'very_hard') { veryHard++; totalMarked++; }
      else if (pref === 'removed') { totalMarked++; }
    }
    var pct = Math.round(totalMarked / ws.length * 100);
    h += '<button class="unit-btn" onclick="openUnit(' + u + ')">';
    h += 'U' + (u+1);
    h += '<span class="u-label">' + ws.length + '词' + (veryHard>0?' · '+veryHard+'很难':'') + '</span>';
    if (pct > 0) h += '<div class="unit-progress"><div class="unit-progress-bar" style="width:' + pct + '%"></div></div>';
    h += '</button>';
  }
  $('unitGrid').innerHTML = h;

  var inp = $('jumpInput');
  inp.max = total;
  updateTrashBadge();
}

    return;
  }
  openUnit(v - 1);
}

  var up = ufPrefs(), removed = 0;

function updateBadges() {
  var ws = wordsInUnit(curUnit), up = ufPrefs();
  var groups = Math.ceil(ws.length / GROUP_SIZE);
  for (var g = 0; g < groups; g++) {
    var end = Math.min((g+1) * GROUP_SIZE, ws.length);
    for (var w = g * GROUP_SIZE; w < end; w++) {
      var lw = w - g * GROUP_SIZE;
      var bd = document.querySelector('#wb' + g + '_' + lw + ' .wb-badge');
      if (!bd) continue;
      var pref = up[ws[w].key];
      bd.className = 'wb-badge'; bd.textContent = '';
      if (pref === 'very_hard') { bd.classList.add('wb-veryhard'); bd.textContent = '很难'; }
      else if (pref === 'removed') { bd.classList.add('wb-removed'); bd.textContent = '已移除'; }
    }
  }
}

// ── Trash view ──
function showTrash() {
  stop(); showView('trash');
  var all = allWords(), up = ufPrefs();
  var removed = [];
  for (var i = 0; i < all.length; i++) {
    if (up[all[i].key] === 'removed') removed.push(all[i]);
  }

  if (removed.length === 0) {
    $('trashContainer').innerHTML = '';
    $('emptyTrash').style.display = 'block';

  }
  $('emptyTrash').style.display = 'none';

  var h = '';

}

function restoreWord(key) {
  var up = ufPrefs();
  delete up[key];
  saveUfPrefs(up);
  showTrash();
  updateTrashBadge();
}

// ── Prefs ──
function setPref(g, w, act) {
  var ws = wordsInUnit(curUnit);
  var lw = w;
  var word = null;
  for (var i = g * GROUP_SIZE; i < Math.min((g+1) * GROUP_SIZE, ws.length); i++) {
    if (i - g * GROUP_SIZE === w) { word = ws[i]; break; }
  }
  if (!word) return;

  var up = ufPrefs();
  if (act === 'reset') delete up[word.key];
  else up[word.key] = act;
  saveUfPrefs(up);
  haptic(18);

  updateBadges();
  // Update group stat
  var groups = Math.ceil(ws.length / GROUP_SIZE);
  for (var gi = 0; gi < groups; gi++) {
    var gStart = gi * GROUP_SIZE, gEnd = Math.min(gStart + GROUP_SIZE, ws.length);
    var gHard = 0;
    for (var wi = gStart; wi < gEnd; wi++) {
      if (up[ws[wi].key] === 'very_hard') gHard++;
    }
    var gh = document.querySelector('#groupContainer .word-group:nth-child('+(gi+1)+') .group-stat');
    if (gh) gh.textContent = (gEnd - gStart) + '词' + (gHard>0?' · '+gHard+'很难':'');
  }
  var el = $('ws' + g + '_' + w);
  if (el) setTimeout(function(){ closeSw(el); }, 200);
  updateTrashBadge();
}

// ── Step definitions ──
function getWordLabels(g, w) {
  var ws = wordsInUnit(curUnit);
  var wi = g * GROUP_SIZE + w;
  if (wi >= ws.length) return {labels:[], isENs:[]};
  var key = ws[wi].key;
  var up = ufPrefs();
  if (up[key] === 'very_hard') {
    return {
      labels: ['英①','英②','中①','中②','英③','中③','英④','中④','英⑤','中⑤','英⑥','中⑥','英⑦','英⑧','中⑦','英⑨','中⑧'],
      isENs: [true,true,false,false,true,false,true,false,true,false,true,false,true,true,false,true,false]
    };
  }
  // default (12 steps, matching source "hard")
  return {
    labels: ['英①','英②','中①','中②','英③','中③','英④','中④','英⑤','中⑤','英⑥','中⑥'],
    isENs: [true,true,false,false,true,false,true,false,true,false,true,false]
  };
}

// ── Audio URL resolution ──
var ufAudioGeneration = 0;

function fetchJsonWithRetry(url, attempts, timeoutMs) {
  attempts = Math.max(1, attempts || 1);
  function run(attempt) {
    var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
    return new Promise(function(resolve, reject) {
      var settled = false;
      var timer = setTimeout(function() {
        if (settled) return;
        settled = true;
        if (controller) controller.abort();
        reject(new Error('request_timeout'));
      }, Math.max(1000, timeoutMs || 15000));
      fetch(url, controller ? {signal:controller.signal} : {}).then(function(response) {
        if (settled) return;
        settled = true; clearTimeout(timer);
        if (!response.ok) { reject(new Error('http_' + response.status)); return; }
        response.json().then(resolve, reject);
      }, function(error) {
        if (settled) return;
        settled = true; clearTimeout(timer); reject(error);
      });
    }).catch(function(error) {
      if (attempt + 1 >= attempts) throw error;
      return new Promise(function(resolve) { setTimeout(resolve, 450 * Math.pow(2, attempt)); })
        .then(function() { return run(attempt + 1); });
    });
  }
  return run(0);
}

// HB audio from unit-level JSON bundles (../hb/audio_unit{N}.json)
var hbPreloaded = {};     // globalIdx_lang → blob URL
var hbUnitsLoading = {};  // unitIdx → true | 'loading'
var hbUnitsCbs = {};      // unitIdx → [callbacks]

function loadHbUnitAudio(u, cb) {
  if (hbUnitsLoading[u] === true) { if (cb) cb(); return; }
  if (cb) {
    if (!hbUnitsCbs[u]) hbUnitsCbs[u] = [];
    hbUnitsCbs[u].push(cb);
  }
  if (hbUnitsLoading[u] === 'loading') return;
  hbUnitsLoading[u] = 'loading';
  var generation = ufAudioGeneration;

  fetchJsonWithRetry('../hb/audio_unit' + u + '.json?v=' + TS, 3, 15000)
    .then(function(data) {
      if (generation !== ufAudioGeneration) return;
      hbUnitsLoading[u] = true;
      for (var w = 0; w < data.words.length; w++) {
        if (!data.words[w]) continue;
        var globalW = u * 30 + w;
        hbPreloaded[globalW + '_en'] = b64toBlobUrl(data.words[w].en);
        hbPreloaded[globalW + '_cn'] = b64toBlobUrl(data.words[w].cn);
      }
      var cbs = hbUnitsCbs[u];
      if (cbs) { cbs.forEach(function(fn) { fn(); }); delete hbUnitsCbs[u]; }
    })
    .catch(function() {
      if (generation !== ufAudioGeneration) return;
      delete hbUnitsLoading[u];
      var cbs = hbUnitsCbs[u];
      if (cbs) { cbs.forEach(function(fn) { fn('err'); }); delete hbUnitsCbs[u]; }
    });
}

function waitForHbUnit(u, cb) {
  if (hbUnitsLoading[u] === true) { cb(); return; }
  if (!hbUnitsCbs[u]) hbUnitsCbs[u] = [];
  hbUnitsCbs[u].push(cb);
  if (hbUnitsLoading[u] !== 'loading') loadHbUnitAudio(u);
}

function b64toBlobUrl(b64) {
  var raw = atob(b64), bytes = new Uint8Array(raw.length);
  for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
  return URL.createObjectURL(new Blob([bytes], {type: 'audio/mpeg'}));
}

function segUrl(g, w, ns) {
  var ws = wordsInUnit(curUnit);
  var wi = g * GROUP_SIZE + w;
  if (wi >= ws.length) return null;
  var word = ws[wi];
  var info = getWordLabels(g, w);
  if (ns >= info.labels.length) return null;
  var isEN = info.isENs[ns], lang = isEN ? 'en' : 'cn';

  if (word.source === 'hongbaoshu') {
    var key = word.srcIdx + '_' + lang;
    if (hbPreloaded[key]) return hbPreloaded[key];
    // Trigger fetch and return null (playWord will retry)
    var u = Math.floor(word.srcIdx / 30);
    loadHbUnitAudio(u);
    return null;
  }
  // vocab: check preloaded cache
  var cacheKey = word.srcIdx + '_' + lang;
  if (preloaded[cacheKey]) return preloaded[cacheKey];
  // Not cached yet — try to load from audio_g file
  var map = AUDIO_MAP[String(word.srcIdx)];
  if (!map) return null;
  return loadVocabAudio(map[0], word.srcIdx, lang);
}

// Audio slots (AB swap)
function getAu(slot) {
  if (slot === 0) { if (!auA) auA = new Audio(); return auA; }
  if (!auB) auB = new Audio(); return auB;
}
function loadAu(slot, url) {
  var au = getAu(slot);
  var prev = slot === 0 ? auUrlA : auUrlB;
  if (prev !== url) { au.src = url; if (slot === 0) auUrlA = url; else auUrlB = url; }
}

// ── Vocab audio from base64 JSON files ──
var audioFilesLoaded = {};
var audioLoadCbs = {};

function fetchAudioFile(fileIdx) {
  if (audioFilesLoaded[fileIdx] === true || audioFilesLoaded[fileIdx] === 'loading') return;
  audioFilesLoaded[fileIdx] = 'loading';

  var audioUrl = '../audio_g' + fileIdx + '.json?v=' + TS;
  var generation = ufAudioGeneration;
  fetchJsonWithRetry(audioUrl, 3, 15000)
    .then(function(data) {
      if (generation !== ufAudioGeneration) return;
      if (window.AudioCacheManager) AudioCacheManager.remember(audioUrl);
      audioFilesLoaded[fileIdx] = true;
      for (var i = 0; i < data.words.length; i++) {
        if (!data.words[i]) continue;
        // Compute which global index this is
        // offset within the file
        var gi = findGlobalIdx(fileIdx, i);
        if (gi >= 0) {
          preloaded[gi + '_en'] = base64ToBlob(data.words[i].en);
          preloaded[gi + '_cn'] = base64ToBlob(data.words[i].cn);
        }
      }
      var cbs = audioLoadCbs[fileIdx];
      if (cbs) { cbs.forEach(function(cb){ cb(); }); delete audioLoadCbs[fileIdx]; }
    })
    .catch(function() {
      if (generation !== ufAudioGeneration) return;
      delete audioFilesLoaded[fileIdx];
      var cbs = audioLoadCbs[fileIdx];
      if (cbs) { cbs.forEach(function(cb){ cb('err'); }); delete audioLoadCbs[fileIdx]; }
    });
}

function findGlobalIdx(fileIdx, offset) {
  // Inverse of: for global index gi in vocab words:
  // group_idx = gi // 10, file_idx = min(group_idx, 2)
  // offset = count of words before in groups mapping to same file
  var gi = 0, cnt = 0;
  while (gi < VOCAB.length) {
    var gidx = Math.floor(gi / GROUP_SIZE);
    var fidx = Math.min(gidx, MAX_AUDIO_FILES - 1);
    if (fidx === fileIdx) {
      if (cnt === offset) return gi;
      cnt++;
    }
    gi++;
  }
  return -1;
}

function base64ToBlob(b64) {
  var raw = atob(b64);
  var bytes = new Uint8Array(raw.length);
  for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
  return URL.createObjectURL(new Blob([bytes], {type: 'audio/mpeg'}));
}

function waitForAudioFile(fileIdx, cb) {
  if (audioFilesLoaded[fileIdx] === true) { cb(); return; }
  if (!audioLoadCbs[fileIdx]) audioLoadCbs[fileIdx] = [];
  audioLoadCbs[fileIdx].push(cb);
  if (audioFilesLoaded[fileIdx] !== 'loading') fetchAudioFile(fileIdx);
}

function loadVocabAudio(fileIdx, srcIdx, lang) {
  var cacheKey = srcIdx + '_' + lang;
  if (preloaded[cacheKey]) return preloaded[cacheKey];
  // Trigger fetch
  fetchAudioFile(fileIdx);
  return null; // Will retry after fetch completes
}

// ── Preload unit audio ──
function preloadUnitAudio(u) {
  ufAudioGeneration++;
  for (var k in preloaded) { URL.revokeObjectURL(preloaded[k]); }
  preloaded = {}; preloadDone = false;
  audioFilesLoaded = {};
  for (var k in hbPreloaded) { URL.revokeObjectURL(hbPreloaded[k]); }
  hbPreloaded = {}; hbUnitsLoading = {}; hbUnitsCbs = {};
  var ws = wordsInUnit(u);
  var neededFiles = {};
  var neededHbUnits = {};
  for (var i = 0; i < ws.length; i++) {
    if (ws[i].source === 'vocab') {
      var map = AUDIO_MAP[String(ws[i].srcIdx)];
      if (map) neededFiles[map[0]] = true;
    } else if (ws[i].source === 'hongbaoshu') {
      neededHbUnits[Math.floor(ws[i].srcIdx / 30)] = true;
    }
  }
  var fileList = Object.keys(neededFiles);
  var hbUnitList = Object.keys(neededHbUnits);
  var pending = fileList.length + hbUnitList.length;
  if (pending === 0) { preloadDone = true; return; }
  function done() { pending--; if (pending <= 0) { preloadDone = true; } }
  for (var f = 0; f < fileList.length; f++) {
    waitForAudioFile(parseInt(fileList[f]), done);
  }
  for (var h = 0; h < hbUnitList.length; h++) {
    waitForHbUnit(parseInt(hbUnitList[h]), done);
  }
}

// ── Playback ──
function hl(g, w) {
  document.querySelectorAll('#groupContainer .word-block.active').forEach(function(el){el.classList.remove('active')});
  var wb = $('wb' + g + '_' + w);
  if (wb) wb.classList.add('active');
}
function clearHl() {
  document.querySelectorAll('#groupContainer .word-block.active').forEach(function(el){el.classList.remove('active')});
}

function nextStepAfter(g, ns, nw) {
  var info = getWordLabels(g, nw);
  if (ns + 1 < info.labels.length) return {step: ns + 1, wIdx: nw};
  if (single) return null;
  var ws = wordsInGroup(g);
  // Skip removed words in group playback
  var up = ufPrefs();
  var showR = $('showRemovedToggle') ? $('showRemovedToggle').checked : false;
  var next = nw + 1;
  while (next < ws.length) {
    if (showR || up[ws[next].key] !== 'removed') break;
    next++;
  }
  if (next < ws.length) return {step: 0, wIdx: next};
  return null;
}

function stop() {
  listenPlaybackToken++;
  listenAudioAttemptSerial++;
  if (auA) { auA.onended=null; auA.onerror=null; auA.onplaying=null; auA.pause(); auA.removeAttribute('src'); }
  if (auB) { auB.onended=null; auB.onerror=null; auB.onplaying=null; auB.pause(); auB.removeAttribute('src'); }
  auUrlA = null; auUrlB = null;
  curAudio = null;
  listenAudioFailed = false;
  listenRetryPlayback = null;
  curSlot = 0;
  var groups = Math.ceil(wordsInUnit(curUnit).length / GROUP_SIZE);
  for (var gi = 0; gi < groups; gi++) setBtns(gi, false, false);
}

function done() {
  listenPlaybackToken++;
  listenAudioAttemptSerial++;
  listenAudioFailed = false;
  listenRetryPlayback = null;
  clearHl(); setBtns(curGroup, false, false);
  wIdx = 0; step = 0; paused = false; single = false; curGroup = -1; curSlot = 0;
}

function listenStateIsCurrent(token, unit, group, currentWord, currentStep) {
  return token === listenPlaybackToken && curUnit === unit && curGroup === group &&
    wIdx === currentWord && step === currentStep;
}

function listenAttemptIsCurrent(token, unit, group, currentWord, currentStep, slot, au, attemptId) {
  return listenStateIsCurrent(token, unit, group, currentWord, currentStep) &&
    curSlot === slot && (!au || getAu(slot) === au) &&
    (attemptId == null || attemptId === listenAudioAttemptSerial);
}

function markListenStarted(token, unit, group, currentWord, currentStep, attemptId) {
  if (!listenStateIsCurrent(token, unit, group, currentWord, currentStep) ||
      (attemptId != null && attemptId !== listenAudioAttemptSerial)) return;
  listenAudioFailed = false;
  listenRetryPlayback = null;
  paused = false;
  if (currentStep === 0) {
    var countKey = token + ':' + unit + ':' + group + ':' + currentWord;
    if (listenCountedPlayKey !== countKey) {
      var ws = wordsInGroup(group);
      if (ws[currentWord]) {
        var cnts = ufCounts();
        cnts[ws[currentWord].key] = (cnts[ws[currentWord].key] || 0) + 1;
        saveUfCounts(cnts);
        updateCount(group, currentWord);
        recordUfLearningActivity(ws[currentWord]);
      }
      listenCountedPlayKey = countKey;
    }
  }
  setBtns(group, true, false);
}

function pauseListenForFailure(token, unit, group, currentWord, currentStep, slot, au, err, retry, attemptId) {
  if (!listenStateIsCurrent(token, unit, group, currentWord, currentStep)) return false;
  if (attemptId != null && attemptId !== listenAudioAttemptSerial) return false;
  if (au && !listenAttemptIsCurrent(token, unit, group, currentWord, currentStep, slot, au, attemptId)) return false;
  if (au) {
    au.onended = null; au.onerror = null; au.onplaying = null;
    au.pause();
    if (!err || err.name !== 'NotAllowedError') {
      au.removeAttribute('src');
      if (slot === 0) auUrlA = null; else auUrlB = null;
    }
  }
  listenAudioAttemptSerial++;
  listenAudioFailed = true;
  listenRetryPlayback = retry || function() { playWord(); };
  paused = true;
  setBtns(group, false, false);
  return true;
}

function playListenSegmentAt(slot) {
  var ws = wordsInGroup(curGroup);
  if (wIdx >= ws.length) { done(); return Promise.resolve(false); }
  var token = listenPlaybackToken;
  var unit = curUnit;
  var group = curGroup;
  var currentWord = wIdx;
  var currentStep = step;
  var word = ws[currentWord];
  var url = segUrl(group, currentWord, currentStep);
  if (!url) {
    var wait = null;
    var alreadyLoaded = false;
    if (word && word.source === 'vocab') {
      var map = AUDIO_MAP[String(word.srcIdx)];
      if (map) {
        alreadyLoaded = audioFilesLoaded[map[0]] === true;
        wait = function(cb) { waitForAudioFile(map[0], cb); };
      }
    } else if (word && word.source === 'hongbaoshu') {
      var hbUnit = Math.floor(word.srcIdx / 30);
      alreadyLoaded = hbUnitsLoading[hbUnit] === true;
      wait = function(cb) { waitForHbUnit(hbUnit, cb); };
    }
    if (!wait || alreadyLoaded) {
      pauseListenForFailure(token, unit, group, currentWord, currentStep, slot, null, { name: 'MissingAudio' });
      return Promise.resolve(false);
    }
    setBtns(group, false, true);
    wait(function(err) {
      if (!listenStateIsCurrent(token, unit, group, currentWord, currentStep)) return;
      if (err) {
        pauseListenForFailure(token, unit, group, currentWord, currentStep, slot, null, { name: 'AudioBundleError' }, function() {
          playWord();
        });
        return;
      }
      playWord();
    });
    return Promise.resolve(true);
  }

  curSlot = slot;
  loadAu(slot, url);
  var au = getAu(slot);
  var attemptId = ++listenAudioAttemptSerial;
  curAudio = au;
  au.playbackRate = 1.0;
  hl(group, currentWord);
  var settled = false;
  function fail(err) {
    if (settled || !listenAttemptIsCurrent(token, unit, group, currentWord, currentStep, slot, au, attemptId)) return false;
    settled = true;
    pauseListenForFailure(token, unit, group, currentWord, currentStep, slot, au, err, null, attemptId);
    return false;
  }
  au.onplaying = function() { markListenStarted(token, unit, group, currentWord, currentStep, attemptId); };
  au.onended = function() {
    if (settled || !listenAttemptIsCurrent(token, unit, group, currentWord, currentStep, slot, au, attemptId)) return;
    settled = true;
    au.onended = null; au.onerror = null; au.onplaying = null;
    var nx = nextStepAfter(group, currentStep, currentWord);
    if (!nx) { done(); return; }
    step = nx.step; wIdx = nx.wIdx;
    onSegEnd();
  };
  au.onerror = function() { fail(au.error || { name: 'AudioError' }); };
  var playP;
  try {
    playP = au.play();
  } catch (err) {
    fail(err);
    playP = Promise.resolve(false);
  }
  var playbackPromise;
  if (playP === undefined) {
    markListenStarted(token, unit, group, currentWord, currentStep, attemptId);
    playbackPromise = Promise.resolve(true);
  } else {
    playbackPromise = Promise.resolve(playP).then(function() {
      if (!listenAttemptIsCurrent(token, unit, group, currentWord, currentStep, slot, au, attemptId)) return false;
      markListenStarted(token, unit, group, currentWord, currentStep, attemptId);
      return true;
    }).catch(fail);
  }

  var nx = nextStepAfter(group, currentStep, currentWord);
  if (nx) {
    var nextUrl = segUrl(group, nx.wIdx, nx.step);
    if (nextUrl) loadAu(1 - slot, nextUrl);
  }
  return playbackPromise;
}

function onSegEnd() {
  return playListenSegmentAt(1 - curSlot);
}

function playWord() {
  return playListenSegmentAt(curSlot);
}

function setBtns(gIdx, playing, loading) {
  var playIcon = '<path d="M8 5v14l11-7z"/>';
  var pauseIcon = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
  var isLoading = !!loading;
  var playBtn = $('btnPlay' + gIdx);
  if (playBtn) {
    var icon = playBtn.querySelector('.play-icon'), label = playBtn.querySelector('.btn-label');
    playBtn.disabled = isLoading;
    playBtn.classList.remove('playing','paused');
    if (isLoading) { icon.innerHTML = playIcon; label.textContent = '加载中…'; }
    else if (playing) { playBtn.classList.add('playing'); icon.innerHTML = pauseIcon; label.textContent = '播放中'; }
    else if (paused && curGroup === gIdx) { playBtn.classList.add('paused'); icon.innerHTML = playIcon; label.textContent = '继续'; }
    else { icon.innerHTML = playIcon; label.textContent = '朗读'; }
  }
  var skipBtn = $('btnSkipWord' + gIdx);
  if (skipBtn) skipBtn.disabled = isLoading || !playing;
}

function togglePlay(gIdx) {
  if (curGroup === gIdx && curAudio && !curAudio.ended && !curAudio.paused) {
    listenAudioAttemptSerial++;
    curAudio.pause(); paused = true; setBtns(gIdx, false, false);
  } else if (curGroup === gIdx && paused) {
    resumeListenPlayback(gIdx);
  } else {
    stop();
    curGroup = gIdx; wIdx = 0; step = 0; paused = false; single = false;
    // Skip removed words at start
    var ws = wordsInGroup(gIdx);
    var up = ufPrefs();
    var showR = $('showRemovedToggle') ? $('showRemovedToggle').checked : false;
    while (wIdx < ws.length && !showR && up[ws[wIdx].key] === 'removed') wIdx++;
    if (wIdx >= ws.length) { done(); return; }
    setBtns(gIdx, true, false);
    playWord();
  }
}

function resumeListenPlayback(gIdx) {
  if (curGroup !== gIdx) return Promise.resolve(false);
  if (listenAudioFailed && listenRetryPlayback) {
    var retry = listenRetryPlayback;
    listenAudioFailed = false;
    listenRetryPlayback = null;
    return Promise.resolve().then(retry).then(function(result) {
      return result !== false;
    }).catch(function() {
      return false;
    });
  }
  var token = listenPlaybackToken;
  var unit = curUnit;
  var group = curGroup;
  var currentWord = wIdx;
  var currentStep = step;
  var slot = curSlot;
  var au = getAu(slot);
  if (!au || !au.src) {
    listenAudioFailed = true;
    listenRetryPlayback = function() { playWord(); };
    return resumeListenPlayback(gIdx);
  }
  return playWord();
}

function playSingleW(g, w) {
  stop();
  curGroup = g; wIdx = w; step = 0; paused = false; single = true;
  setBtns(g, true, false);
  playWord();
}

function skipWord(gIdx) {
  haptic(10);
  stop();
  curGroup = gIdx; single = false;
  var ws = wordsInGroup(gIdx);
  // Skip past removed words
  var up = ufPrefs();
  var showR = $('showRemovedToggle') ? $('showRemovedToggle').checked : false;
  var next = wIdx + 1;
  while (next < ws.length && !showR && up[ws[next].key] === 'removed') next++;
  if (next >= ws.length) { done(); return; }
  step = 0; wIdx = next;
  setBtns(gIdx, true, false);
  playWord();
}

function doRewind(gIdx) {
  haptic(10);
  stop();
  curGroup = gIdx; wIdx = 0; step = 0; paused = false; single = false;
  // Skip removed words at start
  var ws = wordsInGroup(gIdx);
  var up = ufPrefs();
  var showR = $('showRemovedToggle') ? $('showRemovedToggle').checked : false;
  while (wIdx < ws.length && !showR && up[ws[wIdx].key] === 'removed') wIdx++;
  if (wIdx >= ws.length) { done(); return; }
  setBtns(gIdx, false, false);
}

// ── Counts ──
function updateCount(g, w) {
  var ws = wordsInUnit(curUnit);
  var wi = g * GROUP_SIZE + w;
  if (wi >= ws.length) return;
  var cnts = ufCounts();
  var cnt = cnts[ws[wi].key] || 0;
  var el = document.querySelector('#wb' + g + '_' + w + ' .wb-count');
  if (el) el.textContent = cnt > 0 ? cnt : '';
}
function updateAllCounts() {
  if (curUnit < 0) return;
  var ws = wordsInUnit(curUnit);
  var groups = Math.ceil(ws.length / GROUP_SIZE);
  for (var g = 0; g < groups; g++) {
    for (var w = g * GROUP_SIZE; w < Math.min((g+1) * GROUP_SIZE, ws.length); w++) {
      updateCount(g, w - g * GROUP_SIZE);
    }
  }
}

// ── Swipe ──
var swOpen = null, swCur = null, swBlk = null, swX = 0, swY = 0, swTX = 0;
function closeSw(el) {
  if (!el) el = swOpen;
  if (el) {
    var b = el.querySelector('.word-block');
    if (b) b.style.transform = 'translateX(0)';
    el.classList.remove('swiped');
  }
  if (swOpen === el || !el) swOpen = null;
}

WordsMotion.bindRevealList({root:document,itemSelector:'.word-swipe',contentSelector:'.word-block',width:100,edgeReserve:22});

document.addEventListener('click', function(e){
  if (!e.target.closest('.word-swipe')) closeSw();
  var wsBtn = e.target.closest('.ws-btn');
  if (wsBtn) {
    setPref(parseInt(wsBtn.dataset.g), parseInt(wsBtn.dataset.w), wsBtn.dataset.act);
    return;
  }
});

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── Init ──
renderUnits();
function initUfNavigation(){
  if(!history||!history.replaceState)return;history.replaceState({ufView:'units',ufDepth:0},'',location.href);ufNavReady=true;
  addEventListener('popstate',function(e){var s=e.state||{ufView:'units',ufDepth:0};ufRestoring=true;ufDepth=Number(s.ufDepth)||0;stop();if(s.ufView==='groups'&&Number.isFinite(Number(s.unit))){curUnit=Number(s.unit);showView('groups',{fromHistory:true});renderGroups();}else if(s.ufView==='trash'){showView('trash',{fromHistory:true});showTrash();}else{curUnit=-1;curGroup=-1;showView('units',{fromHistory:true});renderUnits();}ufRestoring=false;});
  WordsMotion.installEdgeBack({edge:22,indicator:$('appEdgeBack'),canGoBack:function(){return ufDepth>0},getSurface:function(){return $('view-'+ufActiveView)},onBack:function(){history.back()}});
}
initUfNavigation();
</script>
