<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>红宝书 · 考研英语词汇</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(180deg,#dceeff 0,#eef7ff 230px,#f7fafc 480px);color:#172232;padding:16px 16px 104px;padding-top:calc(env(safe-area-inset-top) + 16px);-webkit-tap-highlight-color:transparent;user-select:none}
button{font:inherit}

.hero{text-align:center;margin:28px 0 4px;font-size:24px;font-weight:800}
.hero-sub{text-align:center;color:#86868b;font-size:12px;margin-bottom:24px}

/* Unit grid */
.jump-row{display:flex;gap:8px;margin-bottom:16px}
.jump-input{flex:1;height:40px;border:1px solid #e0e0e0;border-radius:11px;padding:0 12px;font-size:15px;outline:none;-webkit-appearance:none}
.jump-btn{height:40px;border:none;border-radius:11px;background:#007aff;color:#fff;font-size:14px;font-weight:600;padding:0 18px;cursor:pointer;-webkit-appearance:none;outline:none}
.jump-btn:active{opacity:.7}

.unit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.unit-btn{background:#fff;border:none;border-radius:12px;padding:12px 8px;cursor:pointer;text-align:center;font-size:14px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,0.04);display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .16s cubic-bezier(.23,1,.32,1),background-color .16s cubic-bezier(.23,1,.32,1);-webkit-appearance:none;outline:none}
.unit-btn:active{transform:scale(.95);opacity:.7}
.unit-btn.has-progress{background:#e8f5e9}
.unit-btn .u-label{font-size:10px;color:#86868b;font-weight:400}
.unit-progress{width:100%;height:3px;background:#e0e0e0;border-radius:2px;margin-top:4px}
.unit-progress-bar{height:100%;background:#34c759;border-radius:2px}
.hb-words-state{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px;text-align:center;border-radius:22px;border:1px solid var(--a3-line,rgba(255,255,255,.9));background:var(--a3-glass,rgba(255,255,255,.8));box-shadow:var(--a3-shadow,0 12px 34px rgba(12,66,84,.09));backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);margin:12px 0}
.hb-words-state .hb-state-icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;color:var(--ocean,#057a9d)}
.hb-words-state .hb-state-icon svg{width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hb-words-state .hb-spinner svg{animation:hb-spin 1.1s linear infinite;transform-origin:center}
@keyframes hb-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.hb-words-state .hb-state-text{font-size:15px;font-weight:600;color:var(--ink,#102a36);line-height:1.5}
.hb-words-error .hb-state-icon{color:#d32f2f}
.hb-retry-btn{margin-top:14px;padding:9px 22px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--ocean,#057a9d),var(--deep,#07536a));color:#fff;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 8px 20px rgba(7,83,106,.18);transition:transform .16s cubic-bezier(.23,1,.32,1),opacity .16s ease;-webkit-appearance:none;outline:none}
.hb-retry-btn:active{transform:scale(.96);opacity:.85}

/* Group view */
.nav-bar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.nav-bar-actions{margin-left:auto;display:inline-flex;align-items:center;gap:6px}
.nav-back{background:none;border:none;color:#007aff;font-size:16px;cursor:pointer;padding:6px 0}
.nav-title{font-size:17px;font-weight:600}

.word-group{background:#fff;border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.group-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.group-label{font-size:15px;font-weight:600}
.group-stat{font-size:12px;color:#86868b}
.word-list{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}

.word-swipe{position:relative;overflow:hidden;border-radius:10px}
.ws-actions{position:absolute;right:0;top:0;bottom:0;display:flex;align-items:stretch}
.ws-btn{min-width:50px;border:none;color:#fff;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;padding:0 10px;-webkit-appearance:none;outline:none}
.ws-btn:active{filter:brightness(.85)}
.ws-familiar{background:#34c759}
.ws-hard{background:#ff9500}
.ws-reset{background:#8e8e93}
.word-block{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:#f9f9fb;transition:transform .2s cubic-bezier(.23,1,.32,1);position:relative;z-index:1}
.word-block.active{background:#d4f5d4}
.wb-num{font-size:11px;color:#bbb;width:20px;text-align:right;flex-shrink:0}
.wb-en{font-weight:700;font-size:16px;color:#1d1d1f;flex:1}
.word-block.active .wb-en{color:#0a6e0a}
.wb-cn{font-size:14px;color:#86868b;flex:2}
.word-block.active .wb-cn{color:#2d7d2d}
.wb-step{font-size:11px;color:#bbb;white-space:nowrap;display:none}
.word-block.active .wb-step{display:inline}
.wb-count{font-size:9px;color:#aaa;font-weight:600;white-space:nowrap;min-width:20px;text-align:center}
.wb-badge{font-size:10px;font-weight:700;margin-left:2px;padding:1px 5px;border-radius:4px;display:none}
.wb-badge.wb-familiar{display:inline;background:#d4f5d4;color:#0a6e0a}
.wb-badge.wb-hard{display:inline;background:#ffe0cc;color:#cc6600}

.btn-row{display:flex;gap:7px;align-items:center}
.btn-row-top{margin-bottom:8px}
.btn{height:40px;border:none;border-radius:11px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px;transition:transform .16s cubic-bezier(.23,1,.32,1),opacity .12s cubic-bezier(.23,1,.32,1),background-color .16s cubic-bezier(.23,1,.32,1);-webkit-appearance:none;outline:none}
.btn:active{opacity:.7;transform:scale(.97)}
.btn-play{flex:3;background:#007aff;color:#fff}
.btn-play.playing{background:#ff9500}
.btn-play.paused{background:#34c759}
.btn-skip{flex:1.5;background:#f0f0f5;color:#1d1d1f}
.btn-skipword{flex:1.2;background:#f0f0f5;color:#1d1d1f}.btn-group-row{gap:6px;margin-top:8px}.btn-group-row .btn{height:34px;font-size:12px;border-radius:9px}.btn-rewind{flex:1;background:#f0f0f5;color:#1d1d1f}
.btn-prev{flex:1;background:#f0f0f5;color:#1d1d1f}
.btn:disabled{opacity:.35;pointer-events:none}

/* Study mode and recite card: kept in sync with the main vocab card UI */
.study-mode{display:flex;gap:4px;background:#f0f0f5;border-radius:10px;padding:3px;margin:0 0 12px}
.study-mode button{flex:1;border:0;border-radius:8px;background:transparent;color:#6e6e73;padding:8px;font-weight:700;-webkit-appearance:none}
.study-mode button.active{background:#fff;color:#007aff;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.vocab-card-shell{min-height:calc(100vh - 150px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px 24px}
.vocab-card-progress{font-size:12px;color:#8e8e93;margin-bottom:12px}
.vocab-card-stage{width:100%;display:flex;justify-content:center;perspective:900px}
.vocab-card{width:min(92vw,460px);min-height:420px;background:#fbfdfe;border-radius:28px;padding:24px 20px 17px;box-shadow:0 18px 50px rgba(12,66,84,.12);border:1px solid rgba(92,132,145,.16);touch-action:pan-y;position:relative;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.vocab-card::before,.vocab-card::after{position:absolute;top:18px;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:800;opacity:0;transition:opacity .15s}
.vocab-card::before{content:'熟了';left:18px;background:#e3f8e8;color:#1b8f3a}
.vocab-card::after{content:'不熟';right:18px;background:#fff0df;color:#d86b00}
.vocab-card.swipe-left{border-color:rgba(52,199,89,.35);box-shadow:0 18px 50px rgba(52,199,89,.20)}
.vocab-card.swipe-left::before{opacity:1}
.vocab-card.swipe-right{border-color:rgba(255,149,0,.38);box-shadow:0 18px 50px rgba(255,149,0,.20)}
.vocab-card.swipe-right::after{opacity:1}
.vc-word{font-size:clamp(35px,10vw,46px);line-height:1.04;font-weight:850;letter-spacing:0;color:#07536a;margin-bottom:10px;overflow-wrap:anywhere}
.vc-cn{font-size:18px;line-height:1.4;font-weight:720;color:#253f4b;margin-bottom:17px}
.vc-cn-note{flex:none;max-height:96px;margin:-7px 0 11px;padding:9px 11px;border-left:3px solid #56a6ba;background:#edf7f8;color:#48646b;font-size:13px;line-height:1.5;text-align:left;overflow:auto}
.vc-cn-note::before{content:'语义说明';display:block;margin-bottom:3px;color:#397f91;font-size:11px;font-weight:750}
.vc-sentence-zone{min-height:112px;flex:1 1 auto;margin-top:2px;padding:12px 13px 10px;border-radius:18px;background:rgba(230,247,249,.72);border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 22px rgba(30,102,119,.06);max-height:220px;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.vc-sentence-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px;color:#057a9d;font-size:10px;font-weight:850;letter-spacing:.04em;text-transform:uppercase}
  .vc-example-viewport{min-height:0;overflow:hidden}
  .vc-example{margin:0;text-align:left;color:#234b59;font-size:14px;line-height:1.55;font-style:normal}
  .vc-example+.vc-example{margin-top:11px;padding-top:11px;border-top:1px solid rgba(18,76,91,.12)}
  .vc-example-en{font-size:14px;line-height:1.55;font-weight:650;color:#234b59}
  .vc-example-cn{margin-top:4px;font-size:12px;line-height:1.45;font-weight:500;color:#6c8790}
  .vc-example-audio-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.vc-example-audio{height:28px;padding:0 9px;border:1px solid rgba(255,255,255,.88);border-radius:999px;background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(218,241,241,.82));color:#27818a;box-shadow:0 4px 12px rgba(22,77,89,.07),inset 0 1px #fff;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:10px;font-weight:800;cursor:pointer;-webkit-appearance:none}.vc-example-audio svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.vc-example-audio.playing{background:linear-gradient(145deg,#55b2af,#268b91);color:#fff}.vc-example-audio.loading{opacity:.55;pointer-events:none}.vc-example-audio:active{transform:scale(.96)}
  .vc-example-pager{display:grid;grid-template-columns:88px minmax(0,1fr) 88px;align-items:center;gap:8px;margin-top:11px}.vc-example-page{width:auto;min-width:78px;height:34px;padding:0 9px;border:1px solid rgba(255,255,255,.84);border-radius:999px;background:linear-gradient(145deg,rgba(255,255,255,.87),rgba(223,241,242,.8));color:var(--ocean);box-shadow:0 5px 14px rgba(22,77,89,.07),inset 0 1px #fff;display:inline-flex;align-items:center;justify-content:center;gap:3px;font-size:16px;line-height:1}.vc-example-page:last-child{justify-self:end}.vc-example-page span{font-size:10px;font-weight:760}.vc-example-page:disabled{opacity:.32}.vc-example-count{color:var(--muted);font-size:10px;font-weight:720;text-align:center}
.vc-sentence-empty{display:flex;align-items:center;min-height:64px;color:#78919a;font-size:12px;line-height:1.45}
.vc-meta{margin-top:auto;padding-top:15px;font-size:12px;line-height:1.45;color:#7b919b}
.vocab-card-controls{display:flex;justify-content:center;gap:24px;margin-top:28px}
.vc-btn{width:68px;height:68px;border-radius:50%;border:1px solid #dedee3;background:rgba(255,255,255,.72);color:#707074;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;box-shadow:0 3px 10px rgba(0,0,0,.04);-webkit-appearance:none;cursor:pointer}
.vc-btn:active{transform:scale(.96)}
.vc-btn-main{width:78px;height:78px;font-size:26px}
.vc-btn:disabled{opacity:.32}
.recite-rate-actions{display:grid;width:min(100%,420px);margin-top:6px;justify-self:center;gap:6px}
.recite-rate-actions[data-phase="1"],.recite-rate-phase1{grid-template-columns:1fr 1fr}
.recite-rate-actions[data-phase="4"],.recite-rate-4tier{grid-template-columns:repeat(4,1fr)}
.recite-rate-unfamiliar{grid-template-columns:1.8fr 1fr 1fr}
.recite-rate-btn{min-height:46px;border-radius:14px;border:1px solid transparent;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:5px 4px;transition:transform 120ms ease,background-color 140ms ease;-webkit-tap-highlight-color:transparent}
.recite-rate-btn:active{transform:scale(.95)}
.recite-rate-btn .rate-name{font-size:13px;font-weight:750;line-height:1.1}
.recite-rate-btn .rate-hint{font-size:10px;opacity:.8;line-height:1}
.recite-rate-forget{color:#dc2626;background:#fef2f2;border-color:rgba(220,38,38,.2)}
.recite-rate-forget:active{background:#fee2e2}
.recite-rate-uncertain{color:#d97706;background:#fffbeb;border-color:rgba(217,119,6,.2)}
.recite-rate-uncertain:active{background:#fef3c7}
.recite-rate-familiar{color:#059669;background:#ecfdf5;border-color:rgba(5,150,105,.2)}
.recite-rate-familiar:active{background:#d1fae5}
.recite-rate-mastered{color:#4f46e5;background:#eef2ff;border-color:rgba(79,70,229,.2)}
.recite-rate-mastered:active{background:#e0e7ff}
.recite-reveal-trigger{color:#0369a1;background:#f0f9ff;border-color:rgba(3,105,161,.2);flex-direction:row;gap:6px}
.recite-rate-affirm{color:#b91c1c;background:#fff1f2;border-color:rgba(225,29,72,.25);font-weight:800;flex-direction:row;gap:6px}
.recite-rate-affirm:active{background:#ffe4e6}
.recite-rate-btn .rate-icon{display:block;flex:none;margin-bottom:1px}
.vc-phase1-prompt{color:#8aa0a8;font-size:13px;line-height:1.5;margin:8px 0 14px;padding:12px;border-radius:12px;background:rgba(235,245,248,.6);border:1px dashed rgba(92,132,145,.25);text-align:center}
.vc-phase1-prompt.hidden{display:none !important}
.vc-phase2-content.recite-hidden{display:none !important}
.vc-phase2-content{animation:hb-fade-in .16s ease}
@keyframes hb-fade-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.vc-repeat-badge{display:inline-block;vertical-align:middle;margin-left:8px;font-size:11px;font-weight:800;color:#d97706;background:#fffbeb;border:1px solid rgba(217,119,6,.25);border-radius:6px;padding:1px 6px;line-height:1.3}
.vc-repeat-badge.vc-spacer-badge{color:#0284c7;background:#f0f9ff;border-color:rgba(14,165,233,.25)}
.vc-spacer-card{border:1.5px dashed rgba(14,165,233,.35)!important;background:linear-gradient(180deg,rgba(240,249,255,.85) 0%,rgba(255,255,255,.95) 100%)!important}
.vc-spacer-hint{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;margin:8px 0 10px;border-radius:10px;background:rgba(14,165,233,.08);color:#0369a1;font-size:12px;font-weight:600}
.vc-spacer-pass-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:46px;border-radius:14px;border:none;background:linear-gradient(135deg,#0284c7 0%,#0369a1 100%);color:#fff;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(2,132,199,.25);transition:transform 120ms ease,opacity 120ms ease}
.vc-spacer-pass-btn:active{transform:scale(.98);opacity:.9}
.vc-leech-banner{margin:-8px -8px 12px;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,rgba(245,158,11,.14) 0%,rgba(239,68,68,.1) 100%);border:1px solid rgba(245,158,11,.32);color:#92400e}
.vc-leech-hdr{display:flex;align-items:flex-start;gap:10px}
.vc-leech-icon{flex-shrink:0;color:#d97706;margin-top:2px}
.vc-leech-title-wrap{flex:1 1 auto}
.vc-leech-title{font-size:14px;font-weight:700;color:#b45309;line-height:1.3}
.vc-leech-subtitle{font-size:11px;color:#78350f;margin-top:3px;line-height:1.4;opacity:.92}
.vc-leech-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:10px}
.vc-leech-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 12px;border-radius:12px;border:none;font-size:13px;font-weight:700;cursor:pointer;transition:transform 120ms ease,opacity 120ms ease;-webkit-tap-highlight-color:transparent;text-align:center}
.vc-leech-btn:active{transform:scale(.97);opacity:.88}
.vc-leech-defer{background:linear-gradient(135deg,#f59e0b 0%,#d97706 100%);color:#fff;box-shadow:0 4px 12px rgba(217,119,6,.25)}
.vc-leech-retry{background:linear-gradient(135deg,#0ea5e9 0%,#0284c7 100%);color:#fff;box-shadow:0 4px 12px rgba(2,132,199,.25)}
.vc-recite-nav{grid-column:1/-1;text-align:center;margin-top:4px;font-size:12px}
.vc-recite-nav .home-link{color:var(--ocean);background:none;border:none;cursor:pointer;font-size:12px;font-weight:600;padding:2px 4px}
.vc-hint{margin-top:12px;font-size:12px;color:#b0b0b5;text-align:center}
.archive-review-action{border:0;background:transparent;color:#b36760;font-size:12px;font-weight:650;line-height:1.2;cursor:pointer;padding:6px 4px;border-radius:999px;-webkit-tap-highlight-color:transparent;transition:transform 140ms cubic-bezier(.23,1,.32,1),background-color 140ms ease,color 140ms ease}
.archive-review-action:active{transform:scale(.96);background:rgba(180,92,73,.08)}
.focus-action-row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:10px}
.recite-hidden{display:none}
.schedule-feedback{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);z-index:9999;width:max-content;max-width:calc(100vw - 32px);padding:10px 14px;border-radius:12px;background:rgba(24,52,79,.94);color:#fff;box-shadow:0 10px 28px rgba(16,44,70,.24);font-size:13px;line-height:1.45;text-align:center;pointer-events:none;opacity:0;transition:opacity .18s cubic-bezier(.23,1,.32,1),transform .18s cubic-bezier(.23,1,.32,1)}
.schedule-feedback.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.empty-msg{text-align:center;background:#fff;border-radius:14px;padding:34px 18px;color:#86868b}
:root{--ease-out:cubic-bezier(.23,1,.32,1);--ease-drawer:cubic-bezier(.32,.72,0,1);--deep:#07536a;--ocean:#057a9d;--mint:#44b892;--ink:#102a36;--muted:#5f747d;--canvas:#cfe5eb;--glass:rgba(243,251,252,.62);--glass-line:rgba(255,255,255,.76);--surface:#fbfdfe}
html{width:100%;height:100%;overflow:hidden;background:var(--canvas)}
body{width:100%;height:100%;overflow:hidden;background:var(--canvas);color:var(--ink);padding:0}
#view-units,#view-groups{width:100%;max-width:640px;height:100vh;height:100dvh;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 40px);overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:none;-webkit-overflow-scrolling:touch;scrollbar-gutter:stable}
#view-groups.recite-view{position:relative;height:100vh;height:100dvh;overflow:hidden;scrollbar-gutter:auto;display:flex;flex-direction:column;padding-top:calc(env(safe-area-inset-top) + 8px);padding-bottom:calc(env(safe-area-inset-bottom) + 8px)}
#view-groups.recite-view>.nav-bar{position:relative;top:auto;flex:none;min-height:40px;margin:-8px -16px 4px;padding:8px 16px 4px}
#view-groups.recite-view #groupContainer{min-height:0;flex:1 1 auto;display:flex;flex-direction:column;overflow:hidden}
#view-groups.recite-view>.btn-row{display:none}
#view-groups.recite-view .vocab-card-shell{position:relative;width:100%;height:100%;min-height:0;padding:0 4px 4px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"mode mode" "stage stage" "utility utility" "rate rate";grid-template-rows:auto auto auto auto;column-gap:6px;align-content:center;align-items:center}
#view-groups.recite-view .study-mode{grid-area:mode;justify-self:center;margin:0 0 4px}
#view-groups.recite-view .study-mode button{padding:6px 12px;font-size:13px}

  /* ═══════════ MOMO DESIGN SYSTEM & WORD NETWORK STYLES ═══════════ */
  .momo-def-group { display:flex; flex-direction:column; gap:8px; width:100%; margin:6px 0 14px; text-align:left; }
  .momo-def-row { display:flex; align-items:baseline; gap:8px; font-size:16px; line-height:1.5; }

    letter-spacing:.02em; user-select:none;
  }
  .momo-pos-n { color:#0284c7; background:rgba(2,132,199,.12); border:1px solid rgba(2,132,199,.28); }
  .momo-pos-v, .momo-pos-vt, .momo-pos-vi { color:#15803d; background:rgba(21,128,61,.12); border:1px solid rgba(21,128,61,.28); }

  .momo-pos-adv, .momo-pos-ad { color:#7e22ce; background:rgba(126,34,206,.12); border:1px solid rgba(126,34,206,.28); }

  .momo-pos-phrase, .momo-pos-idiom { color:#0e7490; background:rgba(14,116,144,.12); border:1px solid rgba(14,116,144,.28); }
  .momo-def-text { color:var(--ink,#102a36); font-weight:700; flex:1; word-break:break-word; }

  /* 关联网络与图谱 */
  .vc-word-network {
    margin:10px 0 14px; padding:12px 14px;
    background:rgba(255,255,255,.92); border:1px solid rgba(7,83,106,.14);
    border-radius:16px; box-shadow:0 4px 18px rgba(7,83,106,.06);
    text-align:left; animation:vc-net-fade .2s ease;
  }
  @keyframes vc-net-fade { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }
  .vc-net-header {
    display:flex; align-items:center; justify-content:space-between; gap:6px;
    margin-bottom:8px; font-size:11.5px; font-weight:800; color:var(--deep,#07536a);
  }
  .vc-net-tag { display:inline-flex; align-items:center; gap:4px; }
  .vc-net-root-mean { font-size:11px; color:var(--muted,#5f747d); font-weight:600; }
  .vc-net-chips { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:4px; }
  .vc-net-chip {
    display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:8px;
    font-size:11.5px; background:rgba(7,83,106,.05); border:1px solid rgba(7,83,106,.15);
    color:var(--deep,#07536a); cursor:pointer; transition:all .15s ease;
  }
  .vc-net-chip:hover { background:rgba(7,83,106,.12); }
  .vc-net-chip.current { background:#07536a; color:#fff; border-color:#07536a; }
  .vc-net-chip.current small { color:rgba(255,255,255,.8); }
  .vc-net-chip b { font-weight:800; }
  .vc-net-chip small { font-size:10px; color:#5c8491; }

  /* 真题同义替换群 */
  .vc-net-synonyms { margin-top:8px; padding-top:8px; border-top:1px dashed rgba(7,83,106,.15); }
  .vc-net-syn-head {
    display:flex; align-items:center; gap:4px; font-size:11px; font-weight:800;
    color:#0284c7; margin-bottom:6px;
  }

  /* 构词拆解记忆抓手公式 */
  .vc-net-decomp { margin-top:8px; padding-top:8px; border-top:1px dashed rgba(7,83,106,.15); }
  .vc-net-decomp-head {
    display:flex; align-items:center; gap:4px; font-size:11px; font-weight:800;
    color:#059669; margin-bottom:6px;
  }
  .vc-decomp-formula {
    display:flex; flex-wrap:wrap; align-items:center; gap:5px;
    font-size:11.5px; color:var(--ink,#102a36); line-height:1.5;
  }
  .vc-decomp-part {
    padding:2px 7px; border-radius:6px; background:#ffffff;

  }
  .vc-decomp-prefix { color:#059669; background:rgba(5,150,105,.06); }
  .vc-decomp-root { color:#0284c7; background:rgba(2,132,199,.06); }
  .vc-decomp-suffix { color:#7c3aed; background:rgba(124,58,237,.06); }
  .vc-decomp-plus { color:#94a3b8; font-weight:800; font-size:12px; }
  .vc-decomp-arrow { color:#07536a; font-weight:800; margin:0 2px; }
  .vc-decomp-meaning { font-weight:750; color:#07536a; }

  /* 形近辨析 */
  .vc-net-confuse {
    margin-top:8px; padding:8px 11px; background:rgba(245,158,11,.08);
    border:1px solid rgba(245,158,11,.28); border-radius:10px; font-size:11.5px; line-height:1.5;
  }
  .vc-confuse-tag {
    display:inline-flex; align-items:center; gap:3px; font-size:10.5px;
    font-weight:800; color:#b45309; margin-bottom:3px;
  }
  .vc-confuse-text { color:#92400e; font-size:11px; }

  /* 墨式助记卡片 */
  .vc-cn-note {
    background:rgba(240,253,250,.85); border:1px solid rgba(13,148,136,.25);

  .vc-cn-note-hdr {

  /* 例句高亮 */

  }

var StudyCopy = window.StudyCopy || { buttonHTML:function(){return '';}, updateButton:function(){} };

var WORDS = [];

var UNIT_SIZE = 30;
var GROUP_SIZE = 10;
var TS = 1794819900;

function loadHbWords(forceReload) {
  if (hbWordsReady && !forceReload && WORDS.length > 0) {
    return Promise.resolve(WORDS);
  }
  if (hbWordsLoadPromise && !forceReload) {
    return hbWordsLoadPromise;
  }
  hbWordsLoadError = null;
  hbWordsLoadPromise = fetchJsonWithRetry('words.json?v=' + TS, 3, 20000).then(function(data) {
    if (!Array.isArray(data) || data.length === 0) {
      throw new Error('invalid_words_payload');
    }
    WORDS = data;
    UNIT_COUNT = Math.ceil(WORDS.length / UNIT_SIZE);
    hbWordsReady = true;
    hbWordsLoadError = null;
    return WORDS;
  }).catch(function(err) {
    hbWordsLoadPromise = null;
    hbWordsLoadError = err || new Error('load_failed');
    throw hbWordsLoadError;
  });
  return hbWordsLoadPromise;
}

function retryLoadHbWords() {
  hbWordsLoadError = null;
  hbOpenUnitToken = 0;
  renderUnits();
  loadHbWords(true).then(function() {
    if (hbOpenUnitToken > 0) return;
    if (!restoreHbRoute() && !restoreHbResume()) renderUnits();
  }).catch(function() {
    if (curUnit < 0 || hbActiveView === 'units') renderUnits();

}

// ── Word-based key ──
function wordKey(u, g, w) {
  if (!WORDS || !WORDS.length) return '_pending_' + u + '_' + g + '_' + w;
  var idx = u * UNIT_SIZE + g * GROUP_SIZE + w;
  return idx < WORDS.length ? WORDS[idx].en : '_invalid_' + idx;
}

// ── State ──

var auA = null, auB = null, curSlot = 0, auUrlA = null, auUrlB = null;

function globalIdx(u, g, w) { return u * UNIT_SIZE + g * GROUP_SIZE + w; }

  return WORDS.slice(start, Math.min(start + UNIT_SIZE, WORDS.length));
}

  var ws = wordsInUnit(curUnit);

}

function renderUnits() {
  var grid = $('unitGrid');
  if (!grid) return;

    if (hbWordsLoadError) {
      grid.innerHTML = '<div class="hb-words-state hb-words-error">' +

        '</div>' +

      '</div>';

      grid.innerHTML = '<div class="hb-words-state hb-words-loading">' +
        '<div class="hb-state-icon hb-spinner" aria-hidden="true">' +

    h += '</button>';

  grid.innerHTML = h;
}

function jumpToUnit() {

    var rawInput = $('jumpInput') ? $('jumpInput').value : '';

      openUnit(v - 1);
    }).catch(function() {
      if (jumpToken === hbOpenUnitToken && hbActiveView === 'units') renderUnits();

  }
  var v = parseInt($('jumpInput').value);
  if (isNaN(v) || v < 1 || v > UNIT_COUNT) {
    $('jumpInput').style.borderColor = '#ff3b30';

function saveReviewMeta(meta) { ReviewCore.saveReviewMeta(meta); }
function rateReview(source, en, familiar) { return ReviewCore.rateReview(source, en, familiar); }
function undoReview(source, en, old) { ReviewCore.undoReview(source, en, old); }
function archiveHbWord(en, meaning) {

var scheduleFeedbackTimer = null;

  var el = $('scheduleFeedback');

  var meta = loadReviewMeta(), entry = meta[source + ':' + en];
  return entry && entry.intervalDays ? '下次背诵：' + entry.intervalDays + '天后' : '';
}
function showRatingFeedback(source, en, familiar) {

  var isFamiliar = (rating === 'familiar' || rating === 'mastered');
  var labelMap = { forget: '已标记忘记', uncertain: '已标记模糊', familiar: '已标记认识', mastered: '已标记熟知' };

}
function updateCount(g, w) {

function updateAllCounts() {

// ── Audio: unit-level JSON bundles (base64 → blob URL) ──
var audioBundles = {}; // unitIdx → 'loading' | true
var audioBundleCbs = {}; // unitIdx → [callbacks]
var audioBundleTokens = {};

function fetchJsonWithRetry(url, attempts, timeoutMs) {
  attempts = Math.max(1, attempts || 1);
  timeoutMs = Math.max(1000, timeoutMs || 15000);
  function run(attempt) {
    var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = null;
    return new Promise(function(resolve, reject) {
      var settled = false;
      timer = setTimeout(function() {
        if (settled) return;
        settled = true;
        if (controller) controller.abort();
        reject(new Error('request_timeout'));
      }, timeoutMs);
      fetch(url, controller ? {signal:controller.signal} : {}).then(function(response) {
        if (settled) return;
        settled = true; clearTimeout(timer);
        if (!response.ok) { reject(new Error('http_' + response.status)); return; }
        response.json().then(resolve, reject);
      }, function(error) {
        if (settled) return;
        settled = true; clearTimeout(timer); reject(error);
      });
    }).catch(function(error) {
      if (attempt + 1 >= attempts) throw error;
      return new Promise(function(resolve) { setTimeout(resolve, 450 * Math.pow(2, attempt)); })
        .then(function() { return run(attempt + 1); });
    });
  }
  return run(0);
}

function b64toBlob(b64) {
  var raw = atob(b64), bytes = new Uint8Array(raw.length);
  for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
  return URL.createObjectURL(new Blob([bytes], {type: 'audio/mpeg'}));
}

function loadAudioBundle(u, cb) {
  if (audioBundles[u] === true) { if (cb) cb(); return; }
  if (cb) {
    if (!audioBundleCbs[u]) audioBundleCbs[u] = [];
    audioBundleCbs[u].push(cb);
  }
  if (audioBundles[u] === 'loading') return;
  audioBundles[u] = 'loading';
  var requestToken = {};
  audioBundleTokens[u] = requestToken;

  var audioUrl = 'audio_unit' + u + '.json?v=' + TS;
  fetchJsonWithRetry(audioUrl, 3, 15000)
    .then(function(data) {
      if (audioBundleTokens[u] !== requestToken) return;
      if (window.AudioCacheManager) AudioCacheManager.remember(audioUrl);
      if (u !== curUnit) {
        delete audioBundles[u]; delete audioBundleTokens[u];
        var staleCbs = audioBundleCbs[u];
        if (staleCbs) { staleCbs.forEach(function(fn) { fn('stale'); }); delete audioBundleCbs[u]; }
        return;
      }
      audioBundles[u] = true;
      for (var w = 0; w < data.words.length; w++) {
        var audioWord = data.words[w];
        if (!audioWord) continue;
        var globalW = u * UNIT_SIZE + w;
        if (audioWord.en) preloaded[globalW + '_en'] = b64toBlob(audioWord.en);
        if (audioWord.cn) preloaded[globalW + '_cn'] = b64toBlob(audioWord.cn);
        var exampleAudio = Array.isArray(audioWord.example_audio) ? audioWord.example_audio : [];
        for (var exampleIndex = 0; exampleIndex < exampleAudio.length; exampleIndex++) {
          var exampleEntry = exampleAudio[exampleIndex];
          if (!exampleEntry) continue;
          if (exampleEntry.en) preloaded[globalW + '_ex' + exampleIndex + '_en'] = b64toBlob(exampleEntry.en);
          if (exampleEntry.cn) preloaded[globalW + '_ex' + exampleIndex + '_cn'] = b64toBlob(exampleEntry.cn);
        }
      }
      if (u === curUnit) {
        var groups = Math.ceil(wordsInUnit(u).length / GROUP_SIZE);
        for (var gi = 0; gi < groups; gi++) setBtns(gi, false, false);
      }
      preloadDone = true;
      delete audioBundleTokens[u];
      var cbs = audioBundleCbs[u];
      if (cbs) { cbs.forEach(function(fn) { fn(); }); delete audioBundleCbs[u]; }
    })
    .catch(function() {
      if (audioBundleTokens[u] !== requestToken) return;
      delete audioBundles[u];
      delete audioBundleTokens[u];
      var cbs = audioBundleCbs[u];
      if (cbs) { cbs.forEach(function(fn) { fn('err'); }); delete audioBundleCbs[u]; }
    });
}

function mp3Url(globalW, lang) {
  var k = globalW + '_' + lang;
  if (preloaded[k]) return preloaded[k];
  return null;
}

// ── Group rendering ──
function openUnit(u, options) {
  if (!hbWordsReady) {
    if (u < 0) return;
    var reqToken = ++hbOpenUnitToken;
    if (hbActiveView === 'units') renderUnits();
    loadHbWords().then(function() {
      if (reqToken !== hbOpenUnitToken) return;
      if (u >= UNIT_COUNT) {
        curUnit = -1;
        showView('units');
        renderUnits();
        return;
      }
      openUnit(u, options);
    }).catch(function() {
      if (reqToken === hbOpenUnitToken) {
        curUnit = -1;
        showView('units');
        renderUnits();
      }
    });
    return;
  }
  var opts = options || {}, resume = opts.resume;
  stopHbExampleAudio(); stop(); curUnit = u; curGroup = -1; wIdx = 0; step = 0; paused = false; single = false;
  var words = wordsInUnit(u);
  var hasSavedOrder = !!(resume && resume.source === 'hongbaoshu' && resume.unitIdx === u && WordsSessionOrder.isValid(resume.order, words.length));
  hbReciteOrder = hasSavedOrder ? resume.order.slice() : WordsSessionOrder.create(words.length);
  hbReciteOrderUnit = u;
  var resumeIndex = hasSavedOrder ? Number(resume.itemIdx) : (resume ? hbReciteOrder.indexOf(Math.max(0, Number(resume.itemIdx) || 0)) : 0);
  hbReciteIdx = Math.max(0, Math.min(Number.isFinite(resumeIndex) ? resumeIndex : 0, Math.max(0, words.length - 1)));
  hbReciteShown = false; hbReciteUndo = null; hbReciteDone = false; resetHbReciteSession();
  saveHbResume();
  showView('groups');
  var ws = words;
  var start = u * UNIT_SIZE + 1;
  var end = start + ws.length - 1;
  $('groupTitle').textContent = 'Unit ' + (u+1) + ' (' + start + '-' + end + '词)';
  renderGroups();
  updateAllCounts();
  preloadUnit(u);
}

      if (!isShown) {
        hbReciteShow('familiar');
      } else if (hbReciteInitialSense === 'unfamiliar') {
        hbReciteRate('forget');
      } else if (curWord && curWord.en) {
        playCardWordAudio(curWord.en);
      }
    } else if (event.key === '1') {
      event.preventDefault();
      if (!isShown) {
        hbReciteShow('unfamiliar');
      } else {
        hbReciteRate('forget');
      }
    } else if (event.key === '2') {
      event.preventDefault();
      if (isShown) hbReciteRate('uncertain');
    } else if (event.key === '3') {
      event.preventDefault();
      if (!isShown) {
        hbReciteShow('familiar');
      } else {
        hbReciteRate('familiar');
      }
    } else if (event.key === '4') {
      event.preventDefault();
      if (isShown) hbReciteRate('mastered');
    } else if (event.key === 'z' || event.key === 'Z') {
      event.preventDefault();
      hbReciteUndoLast();
    } else if (event.key === 'r' || event.key === 'R') {
      event.preventDefault();
      if (curWord && curWord.en) playCardWordAudio(curWord.en);
    }
  });
}

function updateBadges() {
  var ws = wordsInUnit(curUnit), p = prefs();
  var groups = Math.ceil(ws.length / GROUP_SIZE);
  for (var g = 0; g < groups; g++) {
    var end = Math.min((g+1) * GROUP_SIZE, ws.length);
    for (var w = g * GROUP_SIZE; w < end; w++) {
      var lw = w - g * GROUP_SIZE;
      var bd = document.querySelector('#wb' + g + '_' + lw + ' .wb-badge');
      if (!bd) continue;
      var pref = p[wordKey(curUnit, g, lw)];
      bd.className = 'wb-badge'; bd.textContent = '';
      if (pref === 'familiar') { bd.classList.add('wb-familiar'); bd.textContent = '熟'; }
      else if (pref === 'hard') { bd.classList.add('wb-hard'); bd.textContent = '难'; }
    }
  }
}

function hl(g, w) {
  document.querySelectorAll('#groupContainer .word-block.active').forEach(function(el){el.classList.remove('active')});
  var wb = $('wb' + g + '_' + w);
  if (wb) wb.classList.add('active');
}

function clearHl() {
  document.querySelectorAll('#groupContainer .word-block.active').forEach(function(el){el.classList.remove('active')});
}

// ── Prefs ──
function setPref(g, w, act) {
  var key = wordKey(curUnit, g, w), p = prefs();
  if (act === 'reset') { delete p[key]; savePrefs(p); }
  else if (act === 'familiar' || act === 'hard') { ReviewCore.applyRating('hongbaoshu', key, act === 'familiar', 'listen'); p = prefs(); }
  updateBadges();
  var ws = wordsInUnit(curUnit);
  var groups = Math.ceil(ws.length / GROUP_SIZE);
  for (var gi = 0; gi < groups; gi++) {
    var end = Math.min((gi+1) * GROUP_SIZE, ws.length);
    var fam = 0;
    for (var wi = gi * GROUP_SIZE; wi < end; wi++) {
      if (p[wordKey(curUnit, gi, wi - gi*GROUP_SIZE)] === 'familiar') fam++;
    }
    var gh = document.querySelector('#groupContainer .word-group:nth-child('+(gi+1)+') .group-stat');
    if (gh) gh.textContent = (end - gi*GROUP_SIZE) + '词 · ' + fam + '熟';
  }
  var el = $('ws' + g + '_' + w); if (el) setTimeout(function(){closeSw(el)}, 200);
}

// ── Playback (AB direct swap) ──
function getAu(slot) {
  if (slot === 0) { if (!auA) auA = new Audio(); return auA; }
  if (!auB) auB = new Audio(); return auB;
}
function loadAu(slot, url) {
  var au = getAu(slot);
  var prev = slot === 0 ? auUrlA : auUrlB;
  if (prev !== url) { au.src = url; if (slot === 0) auUrlA = url; else auUrlB = url; }
}

function getWordLabels(w) {
  var pf = prefs()[wordKey(curUnit, curGroup, w)];
  if (pf === 'familiar') return {labels: ['英①','中①'], isENs: [true, false]};
  if (pf === 'hard') return {labels: ['英①','英②','中①','中②','英③','中③','英④','中④','英⑤','中⑤','英⑥','中⑥'], isENs: [true,true,false,false,true,false,true,false,true,false,true,false]};
  return {labels: ['英①','英②','中①','中②','英③','中③','英④','中④'], isENs: [true,true,false,false,true,false,true,false]};
}
function segUrl(w, ns) {
  if (ns < 0) return null;
  var info = getWordLabels(w);
  if (ns >= info.labels.length) return null;
  var lang = info.isENs[ns] ? 'en' : 'cn';
  var globalW = curUnit * UNIT_SIZE + curGroup * GROUP_SIZE + w;
  return mp3Url(globalW, lang);
}
function nextStepAfter(ns, nw) {
  var info = getWordLabels(nw);
  if (ns + 1 < info.labels.length) return {step: ns + 1, wIdx: nw};
  if (single) return null;
  var ws = wordsInGroup(curGroup);
  if (nw + 1 < ws.length) return {step: 0, wIdx: nw + 1};
  return null;
}

function stop() {
  listenPlaybackToken++;
  listenAudioAttemptSerial++;
  if (auA) { auA.onended=null; auA.onerror=null; auA.onplaying=null; auA.pause(); auA.removeAttribute('src'); }
  if (auB) { auB.onended=null; auB.onerror=null; auB.onplaying=null; auB.pause(); auB.removeAttribute('src'); }
  auUrlA = null; auUrlB = null;
  curAudio = null;
  listenAudioFailed = false;
  listenRetryPlayback = null;
  curSlot = 0;
  var groups = Math.ceil(wordsInUnit(curUnit).length / GROUP_SIZE);
  for (var gi = 0; gi < groups; gi++) setBtns(gi, false, false);
}

function done() {
  listenPlaybackToken++;
  listenAudioAttemptSerial++;
  listenAudioFailed = false;
  listenRetryPlayback = null;
  clearHl(); setBtns(curGroup, false, false);
  wIdx = 0; step = 0; paused = false; single = false; curGroup = -1; curSlot = 0;
}

function listenStateIsCurrent(token, unit, group, currentWord, currentStep) {
  return token === listenPlaybackToken && curUnit === unit && curGroup === group &&
    wIdx === currentWord && step === currentStep;
}

function listenAttemptIsCurrent(token, unit, group, currentWord, currentStep, slot, au, attemptId) {
  return listenStateIsCurrent(token, unit, group, currentWord, currentStep) &&
    curSlot === slot && (!au || getAu(slot) === au) &&
    (attemptId == null || attemptId === listenAudioAttemptSerial);
}

function markListenStarted(token, unit, group, currentWord, currentStep, attemptId) {
  if (!listenStateIsCurrent(token, unit, group, currentWord, currentStep) ||
      (attemptId != null && attemptId !== listenAudioAttemptSerial)) return;
  listenAudioFailed = false;
  listenRetryPlayback = null;
  paused = false;
  if (currentStep === 0) {
    var countKey = token + ':' + unit + ':' + group + ':' + currentWord;
    if (listenCountedPlayKey !== countKey) {
      var cnts = loadCounts();
      var key = wordKey(unit, group, currentWord);
      cnts[key] = (cnts[key] || 0) + 1;
      saveCounts(cnts);
      updateCount(group, currentWord);
      var groupWords = wordsInGroup(group);
      if (groupWords[currentWord]) recordLearningActivity(groupWords[currentWord].en, single ? 'hb_single' : 'hb_group');
      listenCountedPlayKey = countKey;
    }
  }
  setBtns(group, true, false);
}

function pauseListenForFailure(token, unit, group, currentWord, currentStep, slot, au, err, retry, attemptId) {
  if (!listenStateIsCurrent(token, unit, group, currentWord, currentStep)) return false;
  if (attemptId != null && attemptId !== listenAudioAttemptSerial) return false;
  if (au && !listenAttemptIsCurrent(token, unit, group, currentWord, currentStep, slot, au, attemptId)) return false;
  if (au) {
    au.onended = null; au.onerror = null; au.onplaying = null;
    au.pause();
    if (!err || err.name !== 'NotAllowedError') {
      au.removeAttribute('src');
      if (slot === 0) auUrlA = null; else auUrlB = null;
    }
  }
  listenAudioAttemptSerial++;
  listenAudioFailed = true;
  listenRetryPlayback = retry || function() { playWord(); };
  paused = true;
  setBtns(group, false, false);
  return true;
}

function playListenSegmentAt(slot) {
  var ws = wordsInGroup(curGroup);
  if (wIdx >= ws.length) { done(); return Promise.resolve(false); }
  var token = listenPlaybackToken;
  var unit = curUnit;
  var group = curGroup;
  var currentWord = wIdx;
  var currentStep = step;
  var url = segUrl(currentWord, currentStep);
  if (!url) {
    if (audioBundles[unit] === true) {
      pauseListenForFailure(token, unit, group, currentWord, currentStep, slot, null, { name: 'MissingAudio' });
      return Promise.resolve(false);
    }
    setBtns(group, false, true);
    loadAudioBundle(unit, function(err) {
      if (!listenStateIsCurrent(token, unit, group, currentWord, currentStep)) return;
      if (err) {
        pauseListenForFailure(token, unit, group, currentWord, currentStep, slot, null, { name: 'AudioBundleError' }, function() {
          playWord();
        });
        return;
      }
      playWord();
    });
    return Promise.resolve(true);
  }

  curSlot = slot;
  loadAu(slot, url);
  var au = getAu(slot);
  var attemptId = ++listenAudioAttemptSerial;
  curAudio = au;
  au.playbackRate = 1.0;
  hl(group, currentWord);
  var settled = false;
  function fail(err) {
    if (settled || !listenAttemptIsCurrent(token, unit, group, currentWord, currentStep, slot, au, attemptId)) return false;
    settled = true;
    pauseListenForFailure(token, unit, group, currentWord, currentStep, slot, au, err, null, attemptId);
    return false;
  }
  au.onplaying = function() { markListenStarted(token, unit, group, currentWord, currentStep, attemptId); };
  au.onended = function() {
    if (settled || !listenAttemptIsCurrent(token, unit, group, currentWord, currentStep, slot, au, attemptId)) return;
    settled = true;
    au.onended = null; au.onerror = null; au.onplaying = null;
    var nx = nextStepAfter(currentStep, currentWord);
    if (!nx) { done(); return; }
    step = nx.step; wIdx = nx.wIdx;
    onSegEnd();
  };
  au.onerror = function() { fail(au.error || { name: 'AudioError' }); };
  var playP;
  try {
    playP = au.play();
  } catch (err) {
    fail(err);
    playP = Promise.resolve(false);
  }
  var playbackPromise;
  if (playP === undefined) {
    markListenStarted(token, unit, group, currentWord, currentStep, attemptId);
    playbackPromise = Promise.resolve(true);
  } else {
    playbackPromise = Promise.resolve(playP).then(function() {
      if (!listenAttemptIsCurrent(token, unit, group, currentWord, currentStep, slot, au, attemptId)) return false;
      markListenStarted(token, unit, group, currentWord, currentStep, attemptId);
      return true;
    }).catch(fail);
  }

  var nx = nextStepAfter(currentStep, currentWord);
  if (nx) {
    var nextUrl = segUrl(nx.wIdx, nx.step);
    if (nextUrl) loadAu(1 - slot, nextUrl);
  }
  return playbackPromise;
}

function onSegEnd() {
  return playListenSegmentAt(1 - curSlot);
}

function playWord() {
  return playListenSegmentAt(curSlot);
}

function setBtns(gIdx, playing, loading) {
  var playIcon = '<path d="M8 5v14l11-7z"/>';
  var pauseIcon = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
  var isLoading = !!loading;
  var playBtn = $('btnPlay' + gIdx);
  if (playBtn) {
    var icon = playBtn.querySelector('.play-icon'), label = playBtn.querySelector('.btn-label');
    playBtn.disabled = isLoading;
    playBtn.classList.remove('playing','paused');
    if (isLoading) { icon.innerHTML = playIcon; label.textContent = '加载中…'; }
    else if (playing) { playBtn.classList.add('playing'); icon.innerHTML = pauseIcon; label.textContent = '播放中'; }
    else if (paused && curGroup === gIdx) { playBtn.classList.add('paused'); icon.innerHTML = playIcon; label.textContent = '继续'; }
    else { icon.innerHTML = playIcon; label.textContent = '朗读'; }
  }
  var skipBtn = $('btnSkipWord' + gIdx);
  if (skipBtn) skipBtn.disabled = isLoading || !playing;
}

function togglePlay(gIdx) {
  if (curGroup === gIdx && curAudio && !curAudio.ended && !curAudio.paused) {
    listenAudioAttemptSerial++;
    curAudio.pause(); paused = true; setBtns(gIdx, false, false);
  } else if (curGroup === gIdx && paused) {
    resumeListenPlayback(gIdx);
  } else {
    stop();
    curGroup = gIdx; wIdx = 0; step = 0; paused = false; single = false;
    setBtns(gIdx, true, false);
    playWord();
  }
}

function resumeListenPlayback(gIdx) {
  if (curGroup !== gIdx) return Promise.resolve(false);
  if (listenAudioFailed && listenRetryPlayback) {
    var retry = listenRetryPlayback;
    listenAudioFailed = false;
    listenRetryPlayback = null;
    return Promise.resolve().then(retry).then(function(result) {
      return result !== false;
    }).catch(function() {
      return false;
    });
  }
  var token = listenPlaybackToken;
  var unit = curUnit;
  var group = curGroup;
  var currentWord = wIdx;
  var currentStep = step;
  var slot = curSlot;
  var au = getAu(slot);
  if (!au || !au.src) {
    listenAudioFailed = true;
    listenRetryPlayback = function() { playWord(); };
    return resumeListenPlayback(gIdx);
  }
  return playWord();
}

function playSingleW(g, w) {
  stop();
  curGroup = g; wIdx = w; step = 0; paused = false; single = true;
  setBtns(g, true, false);
  playWord();
}

function skipWord(gIdx) {
  stop();
  curGroup = gIdx; single = false;
  var ws = wordsInGroup(gIdx);
  if (wIdx + 1 >= ws.length) { done(); return; }
  step = 0; wIdx++;
  setBtns(gIdx, true, false);
  playWord();
}

function doRewind(gIdx) {
  stop();
  curGroup = gIdx; wIdx = 0; step = 0; paused = false; single = false;
  setBtns(gIdx, false, false);
}

// ── Preload (unit-level JSON bundles) ──
var preloaded = {};
var preloadDone = false;

function preloadUnit(u) {
  // Revoke old blob URLs to prevent memory leak
  stopHbExampleAudio();
  for (var k in preloaded) { URL.revokeObjectURL(preloaded[k]); }
  preloaded = {}; preloadDone = false;
  audioBundles = {}; audioBundleCbs = {}; audioBundleTokens = {};
  loadAudioBundle(u);
}

// ── Swipe ──
var swOpen = null, swCur = null, swX = 0, swY = 0, swTX = 0, swBlk = null;
function closeSw(el) {
  if (!el) el = swOpen;
  if (el) {
    var b = el.querySelector('.word-block');
    if (b) b.style.transform = 'translateX(0)';
    el.classList.remove('swiped');
  }
  if (swOpen === el || !el) swOpen = null;
}

WordsMotion.bindRevealList({root:document,itemSelector:'.word-swipe',contentSelector:'.word-block',width:150,edgeReserve:22});

document.addEventListener('click', function(e){
  if (!e.target.closest('.word-swipe')) closeSw();
  var wsBtn = e.target.closest('.ws-btn');
  if (wsBtn) {
    setPref(parseInt(wsBtn.dataset.g), parseInt(wsBtn.dataset.w), wsBtn.dataset.act);
    return;
  }
});

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── Init ──
function restoreHbResume() {
  if (location.search.indexOf('resume=1') < 0) return false;
  var r; try { r = JSON.parse(localStorage.getItem('learning_resume_v1') || '{}'); } catch(e) { return false; }
  if (!r || r.source !== 'hongbaoshu' || !Number.isFinite(r.unitIdx) || r.unitIdx < 0 || r.unitIdx >= UNIT_COUNT) return false;
  hbStudyMode = r.mode === 'recite' ? 'recite' : 'listen';
  openUnit(r.unitIdx, { resume: r });
  if (hbStudyMode === 'recite') { hbReciteDone = false; renderGroups(); }
  return true;
}
function restoreHbRoute() {
  var q; try { q = new URLSearchParams(location.search || ''); } catch(e) { return false; }
  if (!q.has('unit')) return false;
  var unit = Number(q.get('unit')), item = Number(q.get('item'));
  if (!Number.isFinite(unit) || unit < 0 || unit >= UNIT_COUNT) return false;
  hbStudyMode = q.get('mode') === 'recite' ? 'recite' : 'listen';
  openUnit(unit);
  if (hbStudyMode === 'recite') {
    hbReciteIdx = Number.isFinite(item) ? Math.max(0, hbReciteOrder.indexOf(Math.max(0, item))) : 0;
    hbReciteDone = false; renderGroups();
  }
  return true;
}
renderUnits();
loadHbWords().then(function() {
  if (hbOpenUnitToken > 0) return;
  if (!restoreHbRoute() && !restoreHbResume()) renderUnits();
}).catch(function() {
  if (curUnit < 0) renderUnits();
});
function initHbNavigation() {
  if (!history || !history.replaceState) return;
  var initial = hbActiveView, unit = curUnit;
  history.replaceState({hbView:'units',hbDepth:0},'',location.href); hbNavReady = true; hbDepth = 0;
  if (initial !== 'units') { hbDepth = 1; history.pushState({hbView:initial,hbDepth:1,unit:unit},'',location.href); }
  addEventListener('popstate', function(e) {
    var s = e.state || {hbView:'units',hbDepth:0};
    hbRestoring = true;
    hbDepth = Number(s.hbDepth) || 0;
    stopHbExampleAudio();
    stop();
    if (s.hbView === 'groups' && Number.isFinite(Number(s.unit))) {
      var targetUnit = Number(s.unit);
      if (!hbWordsReady) {
        var popToken = ++hbOpenUnitToken;
        curUnit = targetUnit;
        showView('groups', {fromHistory:true});
        loadHbWords().then(function() {
          if (popToken !== hbOpenUnitToken) return;
          if (curUnit === targetUnit && hbActiveView === 'groups') {
            renderGroups();
          }
        }).catch(function() {
          if (popToken === hbOpenUnitToken) {
            curUnit = -1;
            curGroup = -1;
            showView('units', {fromHistory:true});
            renderUnits();
          }
        });
      } else {
        curUnit = targetUnit;
        showView('groups', {fromHistory:true});
        renderGroups();
      }
    } else {
      curUnit = -1;
      curGroup = -1;
      showView('units', {fromHistory:true});
      renderUnits();
    }
    hbRestoring = false;
  });
  WordsMotion.installEdgeBack({edge:22,indicator:$('appEdgeBack'),canGoBack:function(){return hbDepth>0},getSurface:function(){return $('view-'+hbActiveView)},onBack:function(){history.back()}});
}
initHbNavigation();
window.addEventListener('pageshow', function() {
  if (!hbWordsReady) {
    loadHbWords().then(function() {
      if (hbActiveView === 'units') renderUnits();
      else if (hbActiveView === 'groups') renderGroups();
    }).catch(function() {
      if (hbActiveView === 'units') renderUnits();
    });
  }
});
function onSubAppSyncClick() {
  if (typeof WordsSync === 'undefined') return;
  if (!WordsSync.loadGithubConfig().token) { location.href = '../?open=backup'; return; }
  WordsSync.syncNow({ reason: 'hb_click', interactive: true, force: true }).catch(function() {});
}
if (typeof WordsSync !== 'undefined') {
  WordsSync.installLifecycle({
    onApplied: function() {
      if (!hbWordsReady) return;
      if (hbActiveView === 'units') renderUnits();
      else if (hbActiveView === 'groups') {
        updateBadges();
        if (hbStudyMode === 'listen' && curGroup < 0) renderGroups();
      }
    }
  });
}
</script>
