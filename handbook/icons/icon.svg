<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E33"/>
      <stop offset="50%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#060A12"/>
    </linearGradient>
    <radialGradient id="lampGlow5" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="1"/>
      <stop offset="30%" stop-color="#FFB300" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#FF8F00" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF8F00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldPen5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="bookPage5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#E8DEC5"/>
    </linearGradient>
    <filter id="lampShadow5" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- 沉静夜读暗蓝底色 -->
  <rect width="512" height="512" fill="url(#bg5)"/>

  <!-- 细金边框 -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#FFD54F" stroke-width="1.8" stroke-opacity="0.4"/>

  <!-- 青灯暖光晕照射层 (从上方笼罩至书卷) -->
  <circle cx="256" cy="180" r="180" fill="url(#lampGlow5)"/>

  <!-- 考研青灯灯盏造型 -->
  <g filter="url(#lampShadow5)">
    <!-- 灯顶吊环与灯顶盖 -->
    <path d="M 244 54 C 244 45, 268 45, 268 54 Z" fill="#FFD54F"/>
    <path d="M 226 68 L 286 68 L 274 88 L 238 88 Z" fill="#DDA01E"/>
    
    <!-- 灯芯炽盛明光 -->
    <circle cx="256" cy="116" r="14" fill="#FFFFFF"/>
    <circle cx="256" cy="116" r="22" fill="#FFE082" opacity="0.6"/>
  </g>

  <!-- 灯光下展开的玉质古卷与金钢笔 -->
  <g filter="url(#lampShadow5)">
    <!-- 展开的书卷曲面 -->
    <path d="M 90 280 C 160 255, 235 270, 256 280 C 277 270, 352 255, 422 280 L 422 370 C 352 345, 277 360, 256 370 C 235 360, 160 345, 90 370 Z" fill="url(#bookPage5)"/>
    <!-- 书脊中缝线 -->
    <line x1="256" y1="280" x2="256" y2="370" stroke="#C5BA9F" stroke-width="2"/>

    <!-- 书面排印行文 -->
    <g stroke="#B3A588" stroke-width="2" stroke-linecap="round" opacity="0.7">
      <line x1="120" y1="300" x2="225" y2="300"/>
      <line x1="120" y1="316" x2="235" y2="316"/>
      <line x1="120" y1="332" x2="200" y2="332"/>
      <line x1="120" y1="348" x2="220" y2="348"/>
      
      <line x1="277" y1="300" x2="390" y2="300"/>
      <line x1="277" y1="316" x2="375" y2="316"/>
      <line x1="277" y1="332" x2="385" y2="332"/>
    </g>

    <!-- 经典红色采分高光印记 -->
    <rect x="277" y="312" width="65" height="7" rx="2" fill="#E53935" opacity="0.5"/>

    <!-- 破局之笔：斜插在书页上的金色笔尖 (金榜题名寓意) -->
    <g transform="translate(300, 235) rotate(-35)">
      <!-- 笔身 -->
      <path d="M -10 -80 L 10 -80 L 8 0 L -8 0 Z" fill="#1C2333" stroke="url(#goldPen5)" stroke-width="2"/>
      <!-- 笔握与笔舌 -->
      <path d="M -8 0 L 8 0 L 10 16 L -10 16 Z" fill="url(#goldPen5)"/>
      <!-- 经典黄金笔尖 (Nib) -->
      <path d="M -10 16 C -10 32, -4 46, 0 54 C 4 46, 10 32, 10 16 Z" fill="url(#goldPen5)"/>
      <!-- 笔尖中缝刻线与呼吸孔 -->
      <line x1="0" y1="20" x2="0" y2="48" stroke="#7A5200" stroke-width="1.2"/>
      <circle cx="0" cy="28" r="2.5" fill="#7A5200"/>
    </g>
  </g>

  <!-- 顶部题辞 -->
  <text x="256" y="210" font-family="'Noto Serif SC', serif" font-size="20" font-weight="700" letter-spacing="8" fill="#FFE082" text-anchor="middle">青灯黄卷 · 破晓成硕</text>
  <!-- 底部微字 -->
  <text x="256" y="445" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="3" fill="#7F94B0" text-anchor="middle">NIGHT CANDLE &amp; DAWN · KYZZ 2027</text>
</svg>